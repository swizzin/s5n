# s5n — one release = one namespace = one seedbox.
# Nothing in this chart may assume it is the only release in the cluster.

# The palette `box` draws its dialogs in, read from this file by box and rendered by
# nothing: the theme a person picks is a file they already edit. values.schema.json lists
# every name internal/theme accepts.
theme: s5n

# The account root's login admits, written by box from the grant (a values file naming it
# is refused). Nothing about the edge reads it; an app that keeps its own accounts names
# its first account after it (Jellyfin's first user), so the person has one name across
# the box. Empty on a plain install, which is a render failure with Jellyfin on.
login: ""

global:
  # One uid/gid for every app, so every file on /data has one owner.
  puid: 1000
  pgid: 1000
  tz: Etc/UTC

# The chart ships no login of its own, and the apps behind it are admin panels, so
# auth.edge is the explicit statement that one sits in front of this release. box sets it
# and a plain `helm install` must too; a missing or false value is refused at render time
# rather than shipping the stack open.

# The data contract. Every app mounts the same claim at /data:
#   /data/downloads/<category>   qBittorrent save paths
#   /data/media/<category>      Arr root folders
# One filesystem, one path, so hardlinks always work.
#
# The chart creates no storage: both settings name claims that already exist in the
# release namespace, and a render that can see the cluster refuses a name no object has.
# No host path, storage class or size: a static claim cannot be resized from values. box
# creates both from the grant's host paths (`<namespace>-s5n-data`, `-config`); a plain
# install creates them first.
storage:
  data:
    existingClaim: s5n-data
  config:
    # Each app instance uses subPath <instance-name> beneath this claim, e.g.
    # /config/sonarr. Those subdirectories must already exist and be owned by
    # puid:pgid.
    existingClaim: s5n-config

# TLS. Nothing in this chart renders from this key: `box init` picks Let's Encrypt when the
# box has a public address and a self-signed certificate when it does not, and setting
# either value forces that choice. A plain install gets HTTPRoutes only.
tls:
  issuer: ""

# HTTP exposure through the Gateway API. The chart attaches HTTPRoutes to a Gateway it
# does not own; the installer (or the cluster admin) provides the Gateway.
gateway:
  enabled: true
  parentRef:
    name: s5n
    namespace: s5n-gateway
    sectionName: ""
  # Public host, e.g. box.example.com. Empty = match any host.
  host: ""

# A rehearsal box: what `box migrate apply` sets on a box built from a rehearsal snapshot,
# so a copy of a live seedbox's configs cannot run as the live one. It removes the
# public-internet egress from the NetworkPolicy and forces the policies on. box writes it
# in the grant; no values file may set it.
rehearsal: false
# The address every app's rehearsal gate dials: an in-cluster address the lock denies,
# which box proves closed before any app starts. Each app waits in an init container until
# it stops answering. box's, like rehearsal; unused otherwise.
rehearsalGate: ""

networkPolicy:
  enabled: true
  # Where Gateway traffic comes from. The default is for a plain install behind Envoy
  # Gateway: the namespace its proxy fleet runs in, not the Gateway's own. box overrides it
  # on every apply with the namespace of the Service holding the Gateway's address, so no
  # file may set it.
  gatewayFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
  # Extra NetworkPolicyPeers allowed to reach app HTTP ports (e.g. a hostNetwork proxy's node IP).
  extraHttpFrom: []
  # The wiring Job needs the API server to publish its receipt. The chart reads
  # the `kubernetes` Service ClusterIP at install time; these CIDRs are only the
  # fallback for offline rendering (`helm template`), where lookup returns nothing.
  apiServerCIDRs: []

# The wiring Job: a Helm post-install/post-upgrade hook that connects the Arrs to
# qBittorrent, registers them in Prowlarr, proves the /data hardlink contract, and records
# what it verified in `<release>-wiring`. A reconciler, so a second run changes nothing.
wiring:
  enabled: true
  image:
    # The s5n image (this repo), by blessed variant from variants.yaml. The
    # repository is chart-owned; tag/digest may be pinned within it.
    variant: default
  # How long the Job may wait for an app to answer before the release fails.
  timeoutSeconds: 300
  backoffLimit: 2
  resources: {}
  podAnnotations: {}

# Arr API keys live here, generated once and preserved across upgrades (lookup).
secrets:
  existingSecret: ""
  # Optional Plex server token (X-Plex-Token) from a claimed server, handed to Tautulli so no
  # network range is trusted for Plex auth. Absent leaves tautulli/plex pending in the
  # receipt. A key patched into the release Secret survives upgrades; a value here wins,
  # which is how a rotation is applied.
  plexToken: ""
  # The claim token https://plex.tv/claim issues; it expires about four minutes after issue,
  # so it is a "transient" question in catalog.yaml that `box init` asks last and hands to
  # one apply. This key is the way in for a plain `helm install`. Plex only exchanges it
  # while unclaimed, so it does nothing on an upgrade.
  plexClaimToken: ""

apps:
  qbittorrent:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8080
    # Seeded into qBittorrent.conf by an init container with a generated password. Nobody signs
    # in with it: the WebUI skips its login for the release's addresses, so this is only the
    # account the config names, and an existing seedbox's value keeps working.
    webuiUsername: admin
    # qBittorrent has no URL base setting; the route strips the prefix.
    rewritePath: true
    torrent:
      # The peer port: peers must be told the one they can reach, and with a NodePort Service it
      # must sit in the cluster's NodePort range.
      #
      # The chart ships no default, because a fixed number is what collides: the API server
      # hands out its own nodePorts from the upper band, so a default there is a port any
      # Service asking for "any free port" can win first and this Service is then refused.
      # `box init` picks one in the lower band (30000-30085) and records it in the grant; a
      # helm install must set this key, and is refused with a message saying so.
      service:
        # NodePort on the node's own address, so the peer port shares a single-IP box with the
        # Gateway's address without address sharing, and the pod stays free of hostPort. Local
        # keeps real peer source IPs (bans, per-peer limits). LoadBalancer is for a box with a
        # spare address.
        type: NodePort
        externalTrafficPolicy: Local
        # Optional annotations for the peers Service, e.g. metallb.io/loadBalancerIPs
        # when type is LoadBalancer.
        annotations: {}
    resources: {}
    env: {}

  sonarr:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8989
    envPrefix: SONARR
    instances:
      # category is the directory under /data/media this instance's library lives in, and under
      # /data/downloads what it downloads into. A migrated box sets downloadCategory to where
      # the source's torrents already are; the library still moves to category.
      - suffix: ""
        category: tv
        enabled: true
      - suffix: 4k
        category: tv-4k
        enabled: false
    resources: {}
    env: {}

  radarr:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 7878
    envPrefix: RADARR
    instances:
      - suffix: ""
        category: movies
        enabled: true
      - suffix: 4k
        category: movies-4k
        enabled: false
    resources: {}
    env: {}

  prowlarr:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 9696
    envPrefix: PROWLARR
    resources: {}
    env: {}

  # Plex first: Tautulli and Seerr both attach to it. A missing or expired claim token leaves
  # Plex unclaimed; the wiring Job still deploys it and proves it answers.
  plex:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 32400
    # Plex has no URL-base setting, same as qBittorrent; the route strips the prefix.
    rewritePath: true
    # CIDRs that may reach Plex without a Plex.tv token (PLEX_NO_AUTH_NETWORKS). It must stay
    # empty unless a human has checked the ranges: the Gateway's proxy reaches Plex from the
    # pod CIDR, so a range containing it makes every request through the Gateway "local" --
    # unauthenticated admin of the server. NetworkPolicy cannot help. Tautulli uses a real
    # token instead (secrets.plexToken).
    noAuthNetworks: []
    resources: {}
    env: {}

  tautulli:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8181
    # Tautulli keeps its prefix: the init container seals its own http_root, so the app builds
    # its redirects and asset URLs under /tautulli. Stripping the prefix cannot work: it
    # redirects `/` to HTTP_ROOT + "home" and its logout to HTTP_ROOT + "auth/logout"
    # (plexpy/webserve.py, webstart.py at v2.18.2), landing on the login's own /auth.
    rewritePath: false
    resources: {}
    env: {}

  seerr:
    enabled: true
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 5055
    rewritePath: true
    # One Seerr talks to one media server, so a box with both runs one per server. The
    # first instance is `seerr` (named after the app) and reads Plex when the release has
    # it; a `seerr-jellyfin` is the second, at seerr-jellyfin.<domain>. `mediaServer` is
    # optional: absent means Plex when the release runs it and Jellyfin otherwise.
    instances:
      - suffix: ""
        enabled: true
    resources: {}
    env: {}

  # Opt-in: a second media server, software-transcoding until a GPU is a platform feature.
  # Served at jellyfin.<domain>, because a path prefix breaks a subset of its players, and it
  # signs its players in itself, so that host bypasses the box's login (catalog.yaml). Its
  # first-run wizard is closed inside the pod by an init container (templates/workloads.yaml)
  # and a second one owns network.xml's bind address on every start.
  jellyfin:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8096
    # No prefix is used: the catalog serves this app at its own host name, so the route
    # matches its whole site root.
    rewritePath: true
    # The peers whose X-Forwarded-For Jellyfin honours (it takes a subnet;
    # ApiServiceCollectionExtensions.cs, AddProxyAddresses). Empty, it ignores the header
    # (ConfigureForwardHeaders), so every proxied request looks local -- and the endpoints
    # marked LocalAccessOrRequiresElevation answer a local caller without a credential, an
    # anonymous restart for anyone behind the Gateway. box reads the Nodes' podCIDRs at init
    # and records them in the grant; the chart writes them before the app starts, because the
    # value is read once, at startup.
    knownProxies: []
    resources: {}
    env: {}

  # qui is opt-in: a second UI for the same qBittorrent, for its cross-seed and automation.
  # It serves itself under /qui (its own baseUrl), so the route keeps the prefix.
  qui:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 7476
    # qui's baseUrl is set by the chart from the instance name; nothing is
    # stripped, because the app builds its own asset URLs under the prefix.
    rewritePath: false
    resources: {}
    env: {}

  # autobrr is opt-in: it watches IRC announces and hands releases to the download client,
  # and does nothing until indexers are configured by hand. It serves itself under /autobrr
  # (its own baseUrl).
  autobrr:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 7474
    # autobrr's baseUrl is set by the chart from the instance name; nothing is
    # stripped, because the app builds its own asset URLs under the prefix.
    rewritePath: false
    resources: {}
    env: {}

  # Lidarr is opt-in: a box that installs the defaults has no music library, and its root
  # folder wants quality and metadata profiles the operator tunes. The third Arr, so its pod
  # spec, URL base, API key and Prowlarr registration are Sonarr's and Radarr's shape.
  lidarr:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8686
    envPrefix: LIDARR
    instances:
      # Music lives in /data/media/music and downloads into qBittorrent's `lidarr` category,
      # which is the one Lidarr's own client defaults to (QBittorrentSettings.cs at
      # v3.1.2.4902: MusicCategory = "lidarr").
      - suffix: ""
        category: music
        downloadCategory: lidarr
        enabled: true
    resources: {}
    env: {}

  # Bazarr is opt-in, and the one app whose instances pair with the Arrs' rather than adding
  # a library: upstream reads exactly one Sonarr and one Radarr (bazarr/app/config.py at
  # v1.6.2), so `bazarr-4k` reads `sonarr-4k` and `radarr-4k`. An instance is a suffix and
  # nothing else -- it owns no category. A pair with one side enabled wires that side; with
  # neither, the render stops and names the instance.
  #
  # It sits behind the box's one login with its own auth off: Bazarr's auth.type defaults to
  # none (config.py:186) and the chart never sets one.
  bazarr:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 6767
    # The app is told its prefix on every start (general.base_url, sealed by the init
    # container), so it builds its own asset URLs and the route keeps the path.
    rewritePath: false
    instances:
      - suffix: ""
        enabled: true
      - suffix: 4k
        enabled: false
    resources: {}
    env: {}

  # SABnzbd is opt-in: the second download client, for usenet. It is served under /sabnzbd by
  # its own url_base, which the init container seals, and its own login is off: the edge is
  # the only login.
  #
  # It is the one app whose download paths are on the config claim by default
  # (Downloads/incomplete and Downloads/complete, relative to /config), so the init container
  # also seals complete_dir and download_dir onto the data claim: that is what makes an Arr's
  # import a hardlink.
  sabnzbd:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 8080
    # SABnzbd's url_base comes from the instance name via the init container; nothing is
    # stripped, because the app builds its own URLs under it.
    rewritePath: false
    resources: {}
    env: {}

  # PeerBanHelper is opt-in: once connected it bans peers on the rules it ships, and it wants
  # a host name of its own (its WebUI calls /api/... from the site root). Its memory limit is
  # load-bearing: the JVM sizes its heap at 85% of it, and at 85% of the node's without one.
  pbh:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 9898
    resources:
      # The request is what scheduling reserves (the app settles around 115-165MB); the limit is
      # the JVM's heap ceiling, 85% of 512Mi, which it idles far below.
      requests:
        memory: 192Mi
      limits:
        memory: 512Mi
    env: {}

  # FileBrowser Quantum is opt-in: a second way to the same files, and a box with no Arrs has
  # nothing for it to show. Its whole configuration is the ConfigMap this chart owns, so no
  # init container and no credentials; it signs in through the login's provider, behind the
  # edge's login too.
  filebrowser:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    # The image's own default port is 80, which a non-root process cannot bind;
    # the config file takes this value, so the pod and the app agree.
    port: 8080
    # The app builds its asset and API URLs from http.baseURL, which the ConfigMap sets to this
    # instance's path, so the route keeps the prefix.
    rewritePath: false
    resources: {}
    env: {}

  # Maintainerr is opt-in: it deletes media, torrents and leftover folders on rules the
  # operator writes. It has no login of its own, so the edge is the only thing between it and
  # the network.
  maintainerr:
    enabled: false
    image:
      # A blessed variant from variants.yaml; a tag or digest pin stays in its repository.
      variant: default
    port: 6246
    # BASE_PATH is set by the chart from the instance name; nothing is stripped.
    rewritePath: false
    resources: {}
    env: {}
