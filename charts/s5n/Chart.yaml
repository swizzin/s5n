apiVersion: v2
name: s5n
description: swizzin on Kubernetes — a wired, hardlink-safe seedbox stack in one release
type: application
version: 0.6.6
appVersion: "0.6.6"
# Distribution-agnostic: vanilla, k0s, k3s, managed. A floor, never a ceiling: 1.30 is
# where ValidatingAdmissionPolicy is GA, and the platform layer binds one to every user
# namespace to enforce the grant.
kubeVersion: ">=1.30.0-0"
home: https://github.com/swizzin/s5n
sources:
  - https://github.com/swizzin/s5n
keywords: [seedbox, swizzin, sonarr, radarr, prowlarr, qbittorrent]
# What box may do with this release (docs/box.md, "A minimum box version"). min-box rises
# only when an interface box and the chart share changes and an older box would get it
# wrong; a new app, a digest bump or an optional values key leaves it alone. upgrade-from
# is the oldest release this one upgrades from, and `box update` steps through the ones
# between.
#
# 0.6.0 is the floor because box renders the login itself (install/platform/authelia) and
# this chart counts on that one: a session cookie only, so a token an app's page sends no
# longer locks a signed-in person out, with Tautulli behind it and its own login off. A
# 0.5.0 box would render the older login in front of this chart, and no 0.5.0 install is
# upgraded in place.
#
# 0.6.6 raises neither: its one change is qui's image (v1.37.0), which an older box
# reads as data and hands the chart the same values.
annotations:
  box.s5n/min-box: "0.6.0"
  box.s5n/upgrade-from: "0.6.0"
