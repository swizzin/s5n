apiVersion: v2
name: s5n
description: swizzin on Kubernetes — a wired, hardlink-safe seedbox stack in one release
type: application
version: 0.6.3
appVersion: "0.6.3"
# Distribution-agnostic: vanilla, k0s, k3s, managed. Only a floor, never a ceiling.
# 1.30 is where ValidatingAdmissionPolicy is GA; the platform layer binds one to
# every user namespace to enforce the grant.
kubeVersion: ">=1.30.0-0"
home: https://github.com/swizzin/s5n
sources:
  - https://github.com/swizzin/s5n
keywords: [seedbox, swizzin, sonarr, radarr, prowlarr, qbittorrent]
# What box may do with this release (docs/box.md, "A minimum box version").
# min-box goes up only when an interface box and the chart share changes in a
# way an older box would get wrong; a new app, a digest bump or an optional
# values key leaves it alone. upgrade-from is the oldest release this one can be
# upgraded from, and `box update` steps through the releases between when it is
# older.
#
# 0.6.0 raises both. box renders the login itself (install/platform/authelia),
# and this chart counts on 0.6.0's: one that checks only the session cookie, so a
# token an app's page sends (PeerBanHelper's) no longer locks a signed-in person
# out, and Tautulli now sits behind it (`login: portal`) with its own login off.
# A 0.5.0 box would render the older login in front of this chart, so it keeps
# to the 0.5.0 chart. And no 0.5.0 install is upgraded in place: no e2e upgrades
# a real 0.5.0 box and chart, so a 0.5.0 seedbox is reinstalled.
#
# 0.6.3 raises min-box. The chart ships no default peer port: a box installed
# while it defaulted to 31111 has none in its grant or its values, and a 0.6.3
# box writes the port the deployed release already runs into the values it
# installs. An older box would hand this chart no port, and its render refuses.
# upgrade-from stays 0.6.0: the upgrade e2e installs the published 0.6.0 box and
# chart and updates them to this one.
annotations:
  box.s5n/min-box: "0.6.3"
  box.s5n/upgrade-from: "0.6.0"
