{{- /* One StatefulSet + Service (+ HTTPRoute) per instance. Per-app differences are data in
       values.yaml; this template is the only place a pod spec is written. */}}
{{- include "s5n.authEdge" . -}}
{{- include "s5n.claimsExist" . -}}
{{- $root := . -}}
{{- /* A Bazarr instance with neither Arr is refused before anything renders,
       whether or not the wiring Job is switched on: see s5n.bazarrs. */ -}}
{{- if and $root.Values.apps.bazarr $root.Values.apps.bazarr.enabled }}{{ $_ := include "s5n.bazarrs" $root }}{{ end -}}
{{- /* Two hosted instances on one name is one certificate and one login rule for both, and
       a `host` on an app served under a path is a key that does nothing: both are refused
       before anything renders. */ -}}
{{- $_ := include "s5n.checkHosts" $root -}}
{{- range $inst := include "s5n.instances" . | fromJsonArray }}
{{- $cfg := $inst.cfg }}
{{- $ctx := dict "root" $root "inst" $inst }}
{{- $urlBase := printf "/%s" $inst.name }}
{{- $exposure := include "s5n.exposure" (dict "root" $root "app" $inst.app) | trim }}
{{- /* An app that signs in through the login's OIDC provider: the catalog's `oidc: true`,
       the same flag box reads to register the client.

       auth.oidc.gatewayIP is the switch, not the app's name: box writes it at init from the
       Gateway's proxy Service, and an OIDC app cannot reach its issuer (the box's own HTTPS
       URL) without it -- and one whose own login is off then has no way in at all. A plain
       helm install has no such value and gets the app's previous shape, no login in the app
       and the edge's in front; which is why this is not `oidc: true` alone. */}}
{{- $oidcIP := "" }}
{{- with $root.Values.auth }}
{{- with .oidc }}
{{- $oidcIP = toString (.gatewayIP | default "") }}
{{- end }}
{{- end }}
{{- $oidc := and (eq (include "s5n.oidc" (dict "root" $root "app" $inst.app) | trim) "true") (ne (toString $root.Values.gateway.host) "") (ne $oidcIP "") }}
{{- $appHost := "" }}
{{- if eq $exposure "host" }}{{ $appHost = include "s5n.appHost" (dict "root" $root "app" $inst.app "name" $inst.name "host" $inst.host) | trim }}{{ end }}
{{- /* The peer port qBittorrent's Service and container take. The chart ships no default: a
       fixed number in the upper NodePort band is one the API server may hand to another
       Service first. box picks a free one from the lower band and records it in the grant. */}}
{{- $torrentPort := "" }}
{{- if eq $inst.app "qbittorrent" }}
{{- $torrentPort = required "apps.qbittorrent.torrent.port: set the peer port peers reach this box on (box records one at init, from the lower band of the NodePort range, 30000-30085 by default)" (($cfg.torrent | default dict).port) }}
{{- end }}
{{- /* FileBrowser Quantum's whole configuration is this file: it never writes it back (every
       UI setting is a database row), mounted at the app's own config path so a migrated
       copy is what the mount hides. Its OIDC client secret cannot live here; see env below. */}}
{{- if eq $inst.app "filebrowser" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $inst.name }}-config
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
data:
  config.yaml: |
    http:
      port: {{ $cfg.port }}
      # The app builds its routes and its own asset and API URLs from this
      # prefix, so the route keeps the path (values.yaml, rewritePath).
      baseURL: {{ $urlBase | quote }}
      # Through the Gateway the person's address arrives in X-Forwarded-For,
      # and OIDC makes this load-bearing: the app builds its redirect_uri from
      # the request it is given, and one built from the pod's own view of the
      # connection would be http on the pod's address -- a URI Authelia refuses.
      # So the Gateway's headers are trusted, which is also what the chart's
      # NetworkPolicy already assumes: the Gateway is the only thing that
      # reaches this port.
      #
      # No trustedProxies: the peer that connects is the proxy *pod*, and the
      # only address a chart can name is the Gateway's Service, which is not
      # what the socket sees. The cost is that the activity log and the auth
      # rate limiter see the proxy's address, not the person's -- not identity,
      # which is the login's.
      trustProxyHeaders: true
      # WebDAV is a second protocol over the same tree, on with no login of its
      # own; the browser is the only client this box serves.
      disableWebDAV: true
    server:
      # The cache is regenerable, and it says so itself: the file index under it
      # is opened with sync off because "DB can be rebuilt"
      # (internal/database/sql/index.go at v2.1.0-stable), the download spool is
      # cleared at every start and the preview thumbnails are LRU-bounded below.
      # So it lives on the pod's emptyDir with a sizeLimit: an index of a large
      # library can never fill the config claim every app's settings live on. A
      # restart re-indexes in the background and the app answers while it does.
      cacheDir: /cache
      # cacheDir/diskcache: 1 GiB of previews, least recently used evicted
      # first. Unlimited, it grows with the library.
      cacheDirMaxSizeMB: 1024
      # A startup call to GitHub is a phone-home nothing here asked for: the
      # chart moves the image by digest and the box updates itself.
      disableUpdateCheck: true
      database:
        path: /config/database.sqlite
      sources:
        # The whole data contract, read-write: the box owner's own file manager
        # behind the box's one login, with an Arr UI's trust and no more. It
        # runs as the release's uid/gid, so the filesystem's owner is the limit.
        #
        # No `name`: the app names a source after the last part of its path
        # ("data"), which is the name a source install already had at /data, so
        # a migrated database's shares and access rules keep resolving.
        - path: /data
          config:
            defaultEnabled: true
            defaultPermissions:
              view: true
              download: true
              modify: true
              create: true
              delete: true
    auth:
      methods:
        {{- if $oidc }}
        # The login's own provider, not a second password: the person signs in
        # at the portal, and this app signs the same person in again by itself
        # -- the round trip is silent, so the visit still looks like one login
        # (catalog.yaml, `oidc: true`; docs/box.md, "Apps that speak OIDC sign
        # in through the login").
        #
        # The client id is box's <namespace>-<app>, and the issuer is the URL
        # the browser used. The redirect_uri is not here: the app builds it from
        # the request (<baseURL>api/auth/oidc/callback), which is why
        # trustProxyHeaders is on above and why box's client names exactly that
        # path (internal/authelia, OIDCCallbackPath).
        #
        # No password method: it would be a form nobody's account can answer,
        # because the app's user rows are made by the provider.
        #
        # No adminGroup. This app grants its own admin only through a group
        # claim, and the login writes its account with no groups, so the person
        # who signs in is a full-permission user of /data and the app's own
        # settings stay the chart's -- which is the honest split while the chart
        # owns the config file (docs/box.md, the open note on group claims).
        password:
          enabled: false
        oidc:
          enabled: true
          clientId: {{ printf "%s-%s" $root.Release.Namespace $inst.app | quote }}
          issuerUrl: {{ printf "https://%s/auth" $root.Values.gateway.host | quote }}
        {{- else }}
        # No provider on this release (a plain helm install, or a grant from
        # before box wrote the Gateway's address): whoever reaches it is the one
        # user, and the edge is the only login in front of it. The app then has
        # no login at all, which is the same shape every other catalog app has
        # on such a box. box records the address at init, so a seedbox's own
        # release takes the branch above.
        noauth: true
        {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  replicas: 1
  serviceName: {{ $inst.name }}
  selector:
    matchLabels:
      {{- include "s5n.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s5n.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $inst.name }}
        s5n.io/app: {{ $inst.app }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- if $oidc }}
      {{- /* The issuer is https://<host>/auth and the app dials it itself, so the name must resolve
             to the Gateway's proxy and the certificate verify. box reads that address from the
             cluster and writes it into the grant, because a user's apply may not read the Gateway. */}}
      hostAliases:
        - ip: {{ $oidcIP | quote }}
          hostnames:
            - {{ $root.Values.gateway.host | quote }}
      {{- end }}
      securityContext:
        {{- include "s5n.podSecurity" $root | nindent 8 }}
      {{- $credentialInit := or (eq $inst.app "qbittorrent") (eq $inst.app "tautulli") (eq $inst.app "qui") (eq $inst.app "autobrr") (eq $inst.app "pbh") (eq $inst.app "bazarr") (eq $inst.app "sabnzbd") (eq $inst.app "jellyfin") }}
      {{- if or $root.Values.rehearsal $credentialInit }}
      initContainers:
        {{- if $root.Values.rehearsal }}
        {{- /* A rehearsal box's app starts only once its own pod's egress is closed: a CNI programs
               the NetworkPolicy a moment after the pod starts, and an app that dials out in that
               moment (an announce, an IRC join, plex.tv) would reach the internet as the live box.
               box proved the lock with the same address and records it in the grant. */}}
        - name: rehearsal-gate
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - probe
            - tcp
            - --address={{ required "rehearsalGate: a rehearsal box needs the address its apps' gate dials; box writes it into the grant when it applies a rehearsal snapshot" $root.Values.rehearsalGate }}
            - --want=closed
            - --timeout=2s
            - --settle=60s
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
        {{- end }}
        {{- if $credentialInit }}
        {{- /* qBittorrent and Tautulli generate their own WebUI/API credential on first start, and
               qui and autobrr hand out a key only to a signed-in session: none can be given
               credentials from the environment, so each gets an init container that seals a known
               value into its own config or user table first, on the app's own config subPath. */}}
        {{- if eq $inst.app "sabnzbd" }}
        {{- /* SABnzbd's image copies /defaults/sabnzbd.ini into /config and rewrites api_key,
               nzb_key and host_whitelist from SABNZBD__* on every start. Three settings cannot be
               expressed that way, and each one is a 403 or a copy instead of a hardlink: url_base
               (the route's prefix, read when the web app is mounted), complete_dir/download_dir
               (the image's default is under /config, which no Arr could hardlink from /data), and
               verify_xff_header (on, the Gateway's X-Forwarded-For classifies the person as external
               and the UI answers 403). internal/sabconf seals them by line, writing only on a change. */}}
        - name: defaults
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ ! -f /config/sabnzbd.ini ]; then
                cp /defaults/sabnzbd.ini /config/sabnzbd.ini
              fi
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
        - name: config
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - sabnzbd-config
            - --conf=/config/sabnzbd.ini
            - --api-key-file={{ printf "/etc/s5n/keys/%s-apikey" $inst.name }}
            - --url-base={{ $urlBase }}
            - --complete-dir=/data/downloads
            - --download-dir=/data/downloads/incomplete
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- else if eq $inst.app "qbittorrent" }}
        - name: webui-credentials
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - qbt-config
            - --conf=/config/qBittorrent/qBittorrent.conf
            - --username={{ default "admin" $cfg.webuiUsername }}
            - --port={{ $cfg.port }}
            - --password-file=/etc/s5n/keys/qbittorrent-password
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- else if eq $inst.app "tautulli" }}
        - name: api-credentials
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - tautulli-config
            - --conf=/config/config.ini
            - --api-key-file=/etc/s5n/keys/tautulli-apikey
            {{- /* The prefix the route keeps: the app builds its redirects from it, so the value and the
                   route are one decision (rewritePath is false for this app in values.yaml). */}}
            - --http-root={{ $urlBase }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- else if eq $inst.app "bazarr" }}
        {{- /* Bazarr mints its own API key and reads its base_url when it registers its blueprints,
               so both are sealed into its settings file before it reads it. It rewrites that file
               from memory on every start and save, so this runs before each one (internal/bazconf). */}}
        - name: config
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - bazarr-config
            - --conf=/config/config/config.yaml
            - --api-key-file={{ printf "/etc/s5n/keys/%s-apikey" $inst.name }}
            - --base-url={{ $urlBase }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- else if eq $inst.app "qui" }}
        {{- /* qui mints an API key only for a signed-in session, so an unattended install needs an
               account it owns (docs/box.md). Created when missing and set to the Secret's password
               on every start, which also puts back one changed inside the running app. The password
               is piped in from the mounted key: a flag would put it in the pod spec. */}}
        - name: account
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              password="$(cat /etc/s5n/keys/qui-password)"
              printf '%s\n' "$password" | /usr/local/bin/qui create-user --config-dir /config --username {{ include "s5n.wiringAccount" $root }}
              printf '%s\n' "$password" | /usr/local/bin/qui change-password --config-dir /config --username {{ include "s5n.wiringAccount" $root }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- else if eq $inst.app "autobrr" }}
        {{- /* autobrr's account, as qui's, except its create-user exits 1 on a second run: the one
               sentence "only 1 user account is supported" is what counts as done, never `|| true`. */}}
        - name: account
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              password="$(cat /etc/s5n/keys/autobrr-password)"
              if ! out="$(printf '%s\n' "$password" | /usr/local/bin/autobrrctl --config /config create-user {{ include "s5n.wiringAccount" $root }} 2>&1)"; then
                case "$out" in
                  *"only 1 user account is supported"*)
                    # The account is already there, which is the normal case from
                    # the second start on. The sentence is echoed, not swallowed:
                    # it is the record that the failure was that one and not a
                    # database that could not be opened.
                    echo "account already exists (autobrrctl: only 1 user account is supported)"
                    ;;
                  *)
                    printf '%s\n' "$out" >&2
                    exit 1
                    ;;
                esac
              fi
              printf '%s\n' "$password" | /usr/local/bin/autobrrctl --config /config change-password {{ include "s5n.wiringAccount" $root }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- else if eq $inst.app "jellyfin" }}
        {{- /* The first-run wizard, closed before the server the Gateway reaches ever starts. Until
               it completes, Jellyfin's StartupController answers anyone
               (FirstTimeSetupPolicy/FirstTimeSetupHandler.cs at v12.4) and POST /Startup/User names
               the administrator. A route rule cannot close it: Gateway API matching is
               case-sensitive and ASP.NET's routing is not. So the app's own image runs against the
               same /config first, bound to 127.0.0.1, completes the wizard and stops that server with
               SIGTERM so jellyfin.db and its WAL are flushed. A pod is not Ready while an init
               container runs, so nothing outside ever reaches an open wizard. network-config below
               clears the loopback on every start, because a trap does not run on SIGKILL. */}}
        - name: startup-wizard
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              config=/config/config
              net="$config/network.xml"
              serverlog=/cache/.s5n-startup.log
              port={{ $cfg.port }}
              pid=
              # stop the server this container started, and wait for it: that is
              # what flushes jellyfin.db and its WAL. The trap runs on every exit
              # of this shell, including the error exits below; a SIGKILL is the
              # runtime's, and it kills every process in this container with it,
              # so no server outlives this container either way.
              stop() {
                if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                  kill -TERM "$pid" 2>/dev/null || true
                  n=0
                  while kill -0 "$pid" 2>/dev/null && [ "$n" -lt 60 ]; do
                    n=$((n + 1))
                    sleep 1
                  done
                  kill -KILL "$pid" 2>/dev/null || true
                  wait "$pid" 2>/dev/null || true
                fi
              }
              trap stop EXIT
              if [ -f "$config/system.xml" ] && grep -q '<IsStartupWizardCompleted>true<' "$config/system.xml"; then
                echo "startup wizard: already complete"
                exit 0
              fi
              mkdir -p "$config"
              # The server this container starts is bound to the loopback: it is
              # the only server that may answer with the wizard open, and nothing
              # outside this pod can reach a loopback. The file is left that way;
              # network-config, next, clears it on every start.
              if [ -f "$net" ]; then
                if grep -q '<LocalNetworkAddresses>' "$net"; then
                  sed -i 's|<LocalNetworkAddresses>.*</LocalNetworkAddresses>|<LocalNetworkAddresses><string>127.0.0.1</string></LocalNetworkAddresses>|' "$net"
                elif grep -q '<LocalNetworkAddresses */>' "$net"; then
                  sed -i 's|<LocalNetworkAddresses */>|<LocalNetworkAddresses><string>127.0.0.1</string></LocalNetworkAddresses>|' "$net"
                else
                  sed -i 's|</NetworkConfiguration>|  <LocalNetworkAddresses><string>127.0.0.1</string></LocalNetworkAddresses>\n</NetworkConfiguration>|' "$net"
                fi
              else
                printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<NetworkConfiguration>' '  <LocalNetworkAddresses><string>127.0.0.1</string></LocalNetworkAddresses>' '</NetworkConfiguration>' >"$net"
              fi
              echo "startup wizard: starting the server on 127.0.0.1:$port"
              /jellyfin/jellyfin --nowebclient >"$serverlog" 2>&1 &
              pid=$!
              login="${S5N_LOGIN:?S5N_LOGIN is the person's account name}"
              password="$(cat /etc/s5n/keys/jellyfin-user-password)"
              # This read is the readiness gate as well as the wizard's first
              # one: the setup server answers 503 here until the real host is
              # up, and the read is also what creates the first user
              # (UserManager.InitializeAsync only runs from it).
              first=
              n=0
              while :; do
                body="$(curl -sS "http://127.0.0.1:$port/Startup/User" 2>/dev/null || true)"
                case "$body" in
                *'"Name"'*)
                  first="$(printf '%s' "$body" | sed -n 's/.*"Name":"\([^"]*\)".*/\1/p')"
                  break
                  ;;
                esac
                n=$((n + 1))
                if [ "$n" -gt 180 ]; then
                  echo "startup wizard: the server did not answer in 180s:" >&2
                  tail -n 20 "$serverlog" >&2 || true
                  exit 1
                fi
                sleep 1
              done
              grep -m1 'Kestrel is listening on' "$serverlog" | sed 's/^/startup wizard: /' || true
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$(curl -fsS "http://127.0.0.1:$port/Startup/Configuration")" "http://127.0.0.1:$port/Startup/Configuration")"
              case "$code" in
              204) ;;
              *)
                echo "startup wizard: saving the configuration answered $code" >&2
                exit 1
                ;;
              esac
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"Name\":\"$login\",\"Password\":\"$password\"}" "http://127.0.0.1:$port/Startup/User")"
              case "$code" in
              204) echo "startup wizard: account '$login' named" ;;
              403) echo "startup wizard: the first account already has a password; left as '$first'" ;;
              *)
                echo "startup wizard: naming the first account answered $code" >&2
                exit 1
                ;;
              esac
              code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"EnableRemoteAccess":true}' "http://127.0.0.1:$port/Startup/RemoteAccess")"
              case "$code" in
              204) ;;
              *)
                echo "startup wizard: remote access answered $code" >&2
                exit 1
                ;;
              esac
              code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:$port/Startup/Complete")"
              case "$code" in
              204) ;;
              *)
                echo "startup wizard: completing the wizard answered $code" >&2
                exit 1
                ;;
              esac
              sleep 1
              curl -fsS "http://127.0.0.1:$port/System/Info/Public" | grep -q '"StartupWizardCompleted":true' || {
                echo "startup wizard: the server still reports it incomplete" >&2
                exit 1
              }
              echo "startup wizard: complete"
          env:
            - name: S5N_LOGIN
              value: {{ required "login: Jellyfin's first account is named after the box login, so the chart needs it (box writes it from the grant)" $root.Values.login | quote }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- /* network.xml's two settings, before every start. LocalNetworkAddresses empty means every
               interface (NetworkConfiguration.cs at v12.4), the only value this chart can stand
               behind: inside a pod, Jellyfin on 127.0.0.1 is unreachable even from its own pod, and
               the NetworkPolicy is the gate. KnownProxies is written even when the box names none:
               empty makes Jellyfin ignore X-Forwarded-For, and an earlier list must not survive in
               the app's own saves. Every other byte is left alone (internal/jellyconf). */}}
        - name: network-config
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - jellyfin-config
            - --conf=/config/config/network.xml
            {{- range $cfg.knownProxies }}
            - --known-proxy={{ . }}
            {{- end }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
        {{- else if eq $inst.app "pbh" }}
        {{- /* PeerBanHelper's config file, prepared before the app reads it. The token comes from the
               environment, so the one thing this file must say without a person is that this box
               asked for no analytics. Step 2 runs on every start because PBH's own config migrations
               rewrite blocks of the file as versions move. Step 3 is one of them: the script that
               reaches config-version 41 sets privacy.analytics from the jar's template, which says
               true (MainConfigUpdateScript.java at v9.5.4), so a v7 or v8 config would run one start
               with analytics on -- and skipping past 41 would skip eleven real migrations. So a copy
               of the image's own template, one value changed, goes on the boot class path, where
               every migration reads this box's answer. */}}
        - name: config
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              dir=/config/config
              file="$dir/config.yml"
              # template is the jar's config.yml with this box's one answer in
              # it: the app's own config migration reads it, so it must be the
              # image's own file and not a second copy of its settings.
              template=/tmp/pbh-config
              # off_analytics <file>: the privacy block's one key, false.
              off_analytics() {
                awk '
                  /^privacy:/ { block = 1; print; next }
                  block && /^[^ #]/ { block = 0 }
                  block && /^  analytics:/ { print "  analytics: false"; next }
                  { print }
                ' "$1" > "$1.new"
                mv "$1.new" "$1"
              }
              # with_privacy <file>: the block a config older than PBH's own
              # migration 41 does not have.
              with_privacy() {
                if ! grep -q '^privacy:' "$1"; then
                  printf '\nprivacy:\n  analytics: false\n' >> "$1"
                fi
              }
              mkdir -p "$dir" "$template"
              if [ ! -f "$file" ]; then
                unzip -p /app/PeerBanHelper.jar config.yml > "$file"
              fi
              with_privacy "$file"
              off_analytics "$file"
              unzip -p /app/PeerBanHelper.jar config.yml > "$template/config.yml"
              with_privacy "$template/config.yml"
              off_analytics "$template/config.yml"
              # Both files are the promise: the one the app reads now, and the
              # one its migration reads on the start that rewrites it.
              for checked in "$file" "$template/config.yml"; do
                if ! grep -qx '  analytics: false' "$checked"; then
                  echo "$checked has no privacy.analytics key to switch off" >&2
                  exit 1
                fi
              done
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: tmp
              mountPath: /tmp
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $inst.app }}
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: {{ $root.Values.global.tz | quote }}
            {{- if $inst.arr }}
            - name: {{ $cfg.envPrefix }}__SERVER__PORT
              value: {{ $cfg.port | quote }}
            - name: {{ $cfg.envPrefix }}__SERVER__URLBASE
              value: {{ $urlBase | quote }}
            - name: {{ $cfg.envPrefix }}__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: {{ printf "%s-apikey" $inst.name }}
            {{- /* External is the no-op scheme: the UI and /initialize.json are open, /api stays
                   API-key-gated. The login is at the edge (auth.edge), never in the app. */}}
            - name: {{ $cfg.envPrefix }}__AUTH__METHOD
              value: External
            {{- end }}
            {{- if eq $inst.app "qbittorrent" }}
            - name: QBT_WEBUI_PORT
              value: {{ $cfg.port | quote }}
            - name: QBT_TORRENTING_PORT
              value: {{ $torrentPort | quote }}
            {{- else if eq $inst.app "bazarr" }}
            {{- /* The image's own port variable, passed to `bazarr.py --port`
                   (apps/bazarr/entrypoint.sh in home-operations/containers): the flag wins over the
                   config file's port, so the chart's port is the one it listens on. */}}
            - name: BAZARR__PORT
              value: {{ $cfg.port | quote }}
            {{- else if eq $inst.app "sabnzbd" }}
            {{- /* The image's own environment: its entrypoint passes the address and
                   port to `--server` and rewrites the file's key lines from these. */}}
            - name: SABNZBD__PORT
              value: {{ $cfg.port | quote }}
            {{- /* The key the init container sealed, re-applied by the entrypoint on every start, so a
                   file an older image wrote is the release Secret's key too. */}}
            - name: SABNZBD__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: {{ printf "%s-apikey" $inst.name }}
            {{- with $root.Values.gateway.host }}
            {{- /* SABnzbd's DNS-rebinding guard refuses any Host not on this list, and with its own login
                   off the guard is always active (sabnzbd/interface.py:249-275 at 5.1.3). The Service
                   name is here because the wiring Job dials http://<instance>:<port>, and a 403 there
                   would look like a routing fault rather than a host check. */}}
            - name: SABNZBD__HOST_WHITELIST_ENTRIES
              value: {{ printf "%s, %s" $inst.name . | quote }}
            {{- else }}
            - name: SABNZBD__HOST_WHITELIST_ENTRIES
              value: {{ $inst.name | quote }}
            {{- end }}
            {{- else if eq $inst.app "plex" }}
            {{- /* Absent when no claim token was supplied, or once it is consumed: the entrypoint only
                   exchanges it for a server token while PlexOnlineToken is empty. */}}
            - name: PLEX_CLAIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: plex-claim-token
                  optional: true
            {{- with $cfg.noAuthNetworks }}
            - name: PLEX_NO_AUTH_NETWORKS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- else if eq $inst.app "qui" }}
            - name: QUI__HOST
              value: 0.0.0.0
            - name: QUI__PORT
              value: {{ $cfg.port | quote }}
            {{- /* qui's own baseUrl, not a stripped prefix: it builds its asset URLs
                   under it, so the route keeps the path and rewritePath stays false. */}}
            - name: QUI__BASE_URL
              value: {{ $urlBase | quote }}
            {{- if not $oidc }}
            {{- /* qui's login is off, like the Arrs' External scheme: the login is the edge's. The
                   account still exists, unused, and is the one a release that later gains the provider
                   signs in with. Disabling it takes three settings (internal/domain/config.go at
                   v1.35.0: IsAuthDisabled is AuthDisabled && IAcknowledgeThisIsABadIdea, and
                   ValidateAuthDisabledConfig refuses to start without the allowlist). Every address is
                   allowed because the TCP peer is the Gateway's proxy pod, not the browser, and the
                   NetworkPolicy already admits only the Gateway and this release. */}}
            - name: QUI__AUTH_DISABLED
              value: "true"
            - name: QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA
              value: "true"
            - name: QUI__AUTH_DISABLED_ALLOWED_CIDRS
              value: "0.0.0.0/0,::/0"
            {{- end }}
            {{- else if eq $inst.app "autobrr" }}
            {{- /* autobrr reads every setting from its own name in caps (AUTOBRR__<SETTING>,
                   internal/config/config.go's loadFromEnv at v1.90.0), and the image ships no config, so
                   these are its whole first start. Its default 127.0.0.1 is nobody but the pod itself. */}}
            - name: AUTOBRR__HOST
              value: 0.0.0.0
            - name: AUTOBRR__PORT
              value: {{ $cfg.port | quote }}
            {{- /* Its baseUrl, not a stripped prefix: it builds the UI's asset URLs under it, and the
                   trailing slash is required, not cosmetic. It mounts at the base URL's *string* plus the
                   rest of the path (`r.Mount(routeBaseURL, webRouter)`,
                   `r.Mount(routeBaseURL+"api", apiRouter)`, internal/http/server.go:300-302 at v1.90.0),
                   so "/autobrr" would put the API at "/autobrrapi" and answer 404 to everything. */}}
            - name: AUTOBRR__BASE_URL
              value: {{ printf "%s/" $urlBase | quote }}
            {{- /* Legacy mode rewrites the UI's URLs for a proxy that strips the prefix; nothing strips
                   here, so the app writes them itself. */}}
            - name: AUTOBRR__BASE_URL_MODE_LEGACY
              value: "false"
            {{- /* Its own update check is a request to GitHub on every start, a phone-home nothing here
                   asked for: the chart moves the image by digest and the box updates itself. */}}
            - name: AUTOBRR__CHECK_FOR_UPDATES
              value: "false"
            {{- with $root.Values.gateway.host }}
            {{- /* The one origin its UI is reached at. The default is "*", every origin, and the cookie
                   is scoped to this host either way. */}}
            - name: AUTOBRR__CORS_ALLOWED_ORIGINS
              value: {{ printf "https://%s" . | quote }}
            {{- end }}
            {{- else if eq $inst.app "pbh" }}
            {{- /* PeerBanHelper keeps its whole state under `data` in its working directory (/app/data),
                   and that root is a Java system property, not a setting: the image's entrypoint is a
                   plain `java ...` (Dockerfile's ENTRYPOINT at v9.5.4), so JAVA_TOOL_OPTIONS is the way
                   in. */}}
            - name: JAVA_TOOL_OPTIONS
              value: -Dpbh.datadir=/config -Xbootclasspath/a:/tmp/pbh-config
            {{- /* Its WebUI token, from the release Secret: PBH reads `pbh.apiToken` as the switch that
                   wins over config.yml's server.token (Main.setupHttpServer, ExternalSwitch.parse), so
                   the app is given its token without anything writing its config file. */}}
            - name: PBH_APITOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: pbh-token
            {{- /* One login, not two. PBH's login handler reads the token from the request BODY
                   (PBHAuthenticateController.handleLogin), and Envoy Gateway 1.9.3's
                   route credentialInjection cannot reach a JSON field, so injecting a header would add a
                   Secret to every request for no change in who gets in. With this switch off no header is
                   checked at all: the edge's login is the only one. The token above is still set, because
                   an empty one sends PBH into OOBE instead of serving the API. */}}
            - name: PBH_WEB_REQUIRELOGIN
              value: "false"
            {{- else if eq $inst.app "filebrowser" }}
            {{- /* The image's default path is under its home directory, which is on the read-only root
                   filesystem. This is the file the ConfigMap above writes. */}}
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
            {{- else if eq $inst.app "maintainerr" }}
            - name: UI_HOSTNAME
              value: 0.0.0.0
            - name: UI_PORT
              value: {{ $cfg.port | quote }}
            {{- /* Maintainerr applies its global prefix to every route, health and API included, so its
                   own BASE_PATH does the work and the route keeps the prefix. */}}
            - name: BASE_PATH
              value: {{ $urlBase | quote }}
            {{- /* One directory holds everything it writes -- the database, logs, overlays and the UI
                   bundle start.sh stages on every boot -- and DATA_DIR moves it, so the /config subPath
                   is enough. The staged UI is why it has to be writable, not merely readable. */}}
            - name: DATA_DIR
              value: /config
            {{- /* A weekly usage report to the vendor is not a default anyone here chose: TELEMETRY=off
                   is the app's own switch, and it wins over the in-app setting. */}}
            - name: TELEMETRY
              value: "off"
            {{- end }}
            {{- if $oidc }}
            {{- if eq $inst.app "filebrowser" }}
            {{- /* The one setting its config.yaml cannot carry: the client secret. FileBrowser Quantum
                   has no _FILE spelling for it, unlike qui and autobrr, so the chart hands it the Secret
                   through the environment. It is also why this pod is Ready only once the issuer is
                   reachable with the box's certificate: at v2.1.0-stable a provider that will not answer
                   is a fatal error (pkg/settings/config.go:568-571). */}}
            - name: FILEBROWSER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "s5n-oidc-%s" $inst.app }}
                  key: client-secret
            {{- else }}
            {{- $oidcPrefix := upper $inst.app }}
            {{- /* This app signs in through the login's own OIDC provider, so its page offers a login
                   after all, and it is the person's: no account of theirs lives in the app, only the
                   client id and the secret Authelia issued it.

                   One account does live in the app, the automation account the chart owns
                   (s5n.wiringAccount): qui and autobrr hand an API key only to a signed-in session, so an
                   unattended install needs one it controls, and the wiring Job signs in with it. It is
                   not a second way in for a person: the edge's login and the NetworkPolicy bound it.

                   The names are the app's own, read from its name in caps: QUI__<NAME> at v1.35.0
                   (internal/config/config.go:270-276, from internal/domain/config.go:79-84) and
                   AUTOBRR__<NAME> at v1.90.0 (internal/config/config.go:409-432). An app that spells
                   them differently is a chart change the e2e's sign-in would catch. The secret is read
                   from a file, never an env value, because a pod's environment is readable by anything
                   that may describe the pod (qui's bindOrReadFromFile, config.go:1082-1102; autobrr's
                   GetEnvStr, config.go:452-468).

                   autobrr 1.91 refuses the password login outright when the built-in login is off (403,
                   "password login is unavailable in oidc authentication mode",
                   internal/http/auth.go:122-126 at v1.91.1), and then the wiring Job's account has no way
                   in and no downloader is ever registered. So its built-in login stays on, and
                   OIDCAutoRedirect is what keeps the form from being offered; qui answers a password
                   login in its own code and needs neither. An unreachable issuer costs neither a start:
                   qui discovers on demand (internal/api/handlers/oidc.go:87-113 at v1.36.1) and autobrr
                   retries for about four minutes (internal/auth/oidc.go:78-96 at v1.90.0), so Ready
                   proves nothing about the issuer and the e2e's sign-in is the proof for both. */}}
            - name: {{ $oidcPrefix }}__OIDC_ENABLED
              value: "true"
            - name: {{ $oidcPrefix }}__OIDC_ISSUER
              value: {{ printf "https://%s/auth" $root.Values.gateway.host | quote }}
            - name: {{ $oidcPrefix }}__OIDC_CLIENT_ID
              value: {{ printf "%s-%s" $root.Release.Namespace $inst.app | quote }}
            - name: {{ $oidcPrefix }}__OIDC_CLIENT_SECRET_FILE
              value: /etc/s5n-oidc/client-secret
            - name: {{ $oidcPrefix }}__OIDC_REDIRECT_URL
              value: {{ printf "https://%s%s/api/auth/oidc/callback" $root.Values.gateway.host $urlBase | quote }}
            {{- if eq $inst.app "autobrr" }}
            - name: AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN
              value: "false"
            - name: AUTOBRR__OIDC_AUTO_REDIRECT
              value: "true"
            {{- else }}
            - name: {{ $oidcPrefix }}__OIDC_DISABLE_BUILT_IN_LOGIN
              value: "true"
            {{- end }}
            {{- end }}
            {{- /* The anchor, when the box's certificate is not publicly trusted: the login's own root,
                   which box copies into a ConfigMap here. SSL_CERT_DIR adds a directory to Go's system
                   pool; SSL_CERT_FILE would replace the bundle, and every public indexer would then fail
                   its own TLS. The ConfigMap is optional because a Let's Encrypt box has none. */}}
            - name: SSL_CERT_DIR
              value: /etc/s5n-host-ca
            {{- end }}
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
            {{- if eq $inst.app "qbittorrent" }}
            - name: bt-tcp
              containerPort: {{ $torrentPort }}
              protocol: TCP
            - name: bt-udp
              containerPort: {{ $torrentPort }}
              protocol: UDP
            {{- end }}
          {{- /* Thirty minutes to open the port, for every app: an app migrates its database before it
                 listens, and a migration that outlasted the probe would be restarted mid-way. A crash
                 still shows at once, because the container exits on its own. */}}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            {{- if $inst.arr }}
            httpGet:
              path: {{ printf "%s/ping" $urlBase }}
              port: http
            {{- else if $path := include "s5n.readinessPath" (dict "app" $inst.app "name" $inst.name) }}
            httpGet:
              path: {{ $path }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              {{- if eq $inst.app "seerr" }}
              {{- /* Seerr keeps its database, settings and rotated logs in CONFIG_DIRECTORY, which its
                     image defaults to /app/config; the claim at /config would leave that on the read-only
                     root filesystem, an EROFS crash at start. The one app whose config path is not /config. */}}
              mountPath: /app/config
              {{- else }}
              mountPath: /config
              {{- end }}
              subPath: {{ $inst.name }}
            - name: tmp
              mountPath: /tmp
            {{- if eq $inst.app "filebrowser" }}
            {{- /* The chart's config, read-only over the claim's own copy of the
                   path, and the cache the app rebuilds. */}}
            - name: config-file
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: cache
              mountPath: /cache
            {{- end }}
            {{- if $oidc }}
            {{- if ne $inst.app "filebrowser" }}
            - name: oidc
              mountPath: /etc/s5n-oidc
              readOnly: true
            {{- end }}
            - name: host-ca
              mountPath: /etc/s5n-host-ca
              readOnly: true
            {{- end }}
            {{- if eq $inst.app "plex" }}
            - name: transcode
              mountPath: /transcode
            {{- end }}
            {{- if eq $inst.app "jellyfin" }}
            {{- /* Jellyfin's cache: transcode segments go here (JELLYFIN_CACHE_DIR), and its image writes
                   nothing else outside /config, so the read-only root filesystem holds. An emptyDir, not
                   the claim: a segment is the size of the media being watched. */}}
            - name: cache
              mountPath: /cache
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "s5n.dataClaim" $root }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "s5n.configClaim" $root }}
        - name: tmp
          emptyDir: {}
        {{- if eq $inst.app "filebrowser" }}
        {{- /* The index of a large library and 1 GiB of previews fit here, and the app's own archive
               limit is 20 GB: a resumable download larger than the free space fails, while a plain
               one streams through. Losing the cache is a re-index, never a lost setting. */}}
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: config-file
          configMap:
            name: {{ $inst.name }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- end }}
        {{- if $oidc }}
        {{- if ne $inst.app "filebrowser" }}
        {{- /* The client secret box wrote into this namespace, created once and
               never regenerated: the login holds only its digest. */}}
        - name: oidc
          secret:
            secretName: {{ printf "s5n-oidc-%s" $inst.app }}
            defaultMode: 0400
            items:
              - key: client-secret
                path: client-secret
        {{- end }}
        {{- /* Root's anchor, when this box's certificate is not publicly trusted; optional because a
               Let's Encrypt box has no ConfigMap and an empty directory is a valid SSL_CERT_DIR. */}}
        - name: host-ca
          configMap:
            name: s5n-host-ca
            optional: true
        {{- end }}
        {{- if eq $inst.app "plex" }}
        - name: transcode
          emptyDir: {}
        {{- end }}
        {{- if eq $inst.app "jellyfin" }}
        - name: cache
          emptyDir: {}
        {{- end }}
        {{- if eq $inst.app "qbittorrent" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: qbittorrent-password
                path: qbittorrent-password
        {{- else if eq $inst.app "tautulli" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: tautulli-apikey
                path: tautulli-apikey
        {{- else if eq $inst.app "qui" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: qui-password
                path: qui-password
        {{- else if eq $inst.app "autobrr" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: autobrr-password
                path: autobrr-password
        {{- else if eq $inst.app "bazarr" }}
        {{- /* One key per instance, so a second Bazarr has its own and neither can
               read the other's settings. */}}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: {{ printf "%s-apikey" $inst.name }}
                path: {{ printf "%s-apikey" $inst.name }}
        {{- else if eq $inst.app "jellyfin" }}
        {{- /* The person's password, mounted only for the wizard: the container that serves the
               Gateway never sees the credential its player uses. */}}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: jellyfin-user-password
                path: jellyfin-user-password
        {{- else if eq $inst.app "sabnzbd" }}
        {{- /* The key the init container seals and the entrypoint re-applies, so the file, the app and
               the wiring Job all answer to the release Secret's one value. */}}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: {{ printf "%s-apikey" $inst.name }}
                path: {{ printf "%s-apikey" $inst.name }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "s5n.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: http
{{- if eq $inst.app "qbittorrent" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $inst.name }}-peers
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
  {{- with $cfg.torrent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $cfg.torrent.service.type }}
  {{- if ne $cfg.torrent.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ $cfg.torrent.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "s5n.selector" $ctx | nindent 4 }}
  ports:
    - name: bt-tcp
      port: {{ $torrentPort }}
      targetPort: bt-tcp
      protocol: TCP
      {{- if eq $cfg.torrent.service.type "NodePort" }}
      nodePort: {{ $torrentPort }}
      {{- end }}
    - name: bt-udp
      port: {{ $torrentPort }}
      targetPort: bt-udp
      protocol: UDP
      {{- if eq $cfg.torrent.service.type "NodePort" }}
      nodePort: {{ $torrentPort }}
      {{- end }}
{{- end }}
{{- if $root.Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $root.Values.gateway.parentRef.name }}
      namespace: {{ $root.Values.gateway.parentRef.namespace }}
      {{- with $root.Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if eq $exposure "host" }}
  {{- /* This app's UI writes absolute asset paths, so it is served at a name of its own (the
         catalog says so) and never under a prefix; the name's certificate and listeners are
         root's, written from the grant by box. */}}
  hostnames: [{{ $appHost | quote }}]
  {{- else }}
  {{- with $root.Values.gateway.host }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  {{- end }}
  rules:
    {{- if eq $exposure "path" }}
    {{- /* The prefix without its slash redirects to the prefix with it: an app that mounts under
           its base URL as a string (autobrr's `r.Mount(routeBaseURL, ...)`) answers nothing at
           "/autobrr", so a link that dropped the slash would be a dead end. Exact outranks the
           PathPrefix rule below. */}}
    - matches:
        - path:
            type: Exact
            value: {{ $urlBase }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ printf "%s/" $urlBase }}
            statusCode: 301
    {{- end }}
    {{- /* The live task stream is a Server-Sent Events connection that has to stay
           open, and Envoy's route timeout defaults to 15s: the UI's log and task views
           would go quiet with nothing in the logs. It asks for no request timeout
           (Gateway API reads "0s" as none), as the rule below does, and is its own
           rule because Gateway API sends a request to the longest matching prefix:
           the stream takes this one, the rest of /maintainerr the next. */}}
    {{- if and (eq $exposure "path") (eq $inst.app "maintainerr") }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s/api/events/stream" $urlBase }}
      timeouts:
        request: 0s
      backendRefs:
        - name: {{ $inst.name }}
          port: {{ $cfg.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            {{- if eq $exposure "host" }}
            value: /
            {{- else }}
            value: {{ $urlBase }}
            {{- end }}
      {{- /* No request timeout (Gateway API reads "0s" as none). Envoy's 15s default cut real work
             off mid-way: autobrr cleaning a large releases database answered 504 and the app's own
             request was cancelled with it. */}}
      timeouts:
        request: 0s
      {{- if and (eq $exposure "path") $cfg.rewritePath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - name: {{ $inst.name }}
          port: {{ $cfg.port }}
{{- end }}
{{- end }}
