{{- /*
One StatefulSet + Service (+ HTTPRoute) per instance. Per-app differences are data in
values.yaml; this template is the only place a pod spec is written.
*/ -}}
{{- include "s5n.authEdge" . -}}
{{- include "s5n.claimsExist" . -}}
{{- $root := . -}}
{{- range $inst := include "s5n.instances" . | fromJsonArray }}
{{- $cfg := $inst.cfg }}
{{- $ctx := dict "root" $root "inst" $inst }}
{{- $urlBase := printf "/%s" $inst.name }}
{{- $exposure := include "s5n.exposure" (dict "root" $root "app" $inst.app) | trim }}
{{- $appHost := "" }}
{{- if eq $exposure "host" }}{{ $appHost = include "s5n.appHost" (dict "root" $root "app" $inst.app) | trim }}{{ end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  replicas: 1
  serviceName: {{ $inst.name }}
  selector:
    matchLabels:
      {{- include "s5n.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "s5n.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $inst.name }}
        s5n.io/app: {{ $inst.app }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "s5n.podSecurity" $root | nindent 8 }}
      {{- if or (eq $inst.app "qbittorrent") (eq $inst.app "tautulli") }}
      # qBittorrent and Tautulli both generate their own WebUI/API credential on
      # first start and never offer a way to set one from the environment, so
      # each gets its own init container sealing a known value into its config
      # file first. Re-running is a no-op once the file already holds it.
      initContainers:
        {{- if eq $inst.app "qbittorrent" }}
        - name: webui-credentials
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - qbt-config
            - --conf=/config/qBittorrent/qBittorrent.conf
            - --username={{ default "admin" $cfg.webuiUsername }}
            - --port={{ $cfg.port }}
            - --password-file=/etc/s5n/keys/qbittorrent-password
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- else if eq $inst.app "tautulli" }}
        - name: api-credentials
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" $root.Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args:
            - tautulli-config
            - --conf=/config/config.ini
            - --api-key-file=/etc/s5n/keys/tautulli-apikey
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              subPath: {{ $inst.name }}
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $inst.app }}
          image: {{ include "s5n.image" (dict "root" $root "app" $inst.app "path" (printf "apps.%s.image" $inst.app) "image" $cfg.image) }}
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: {{ $root.Values.global.tz | quote }}
            {{- if $inst.arr }}
            - name: {{ $cfg.envPrefix }}__SERVER__PORT
              value: {{ $cfg.port | quote }}
            - name: {{ $cfg.envPrefix }}__SERVER__URLBASE
              value: {{ $urlBase | quote }}
            - name: {{ $cfg.envPrefix }}__AUTH__APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: {{ printf "%s-apikey" $inst.name }}
            # External is the no-op scheme: the UI and /initialize.json are open,
            # /api stays API-key-gated, and AuthenticationRequired does nothing.
            # The login is in front of the release (auth.edge), not in the app.
            - name: {{ $cfg.envPrefix }}__AUTH__METHOD
              value: External
            {{- end }}
            {{- if eq $inst.app "qbittorrent" }}
            - name: QBT_WEBUI_PORT
              value: {{ $cfg.port | quote }}
            - name: QBT_TORRENTING_PORT
              value: {{ $cfg.torrent.port | quote }}
            {{- else if eq $inst.app "plex" }}
            # Absent (optional secretKeyRef) when no claim token was supplied at
            # install, or once it has already been consumed: the entrypoint only
            # exchanges it for a server token when PlexOnlineToken is still empty.
            - name: PLEX_CLAIM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "s5n.secretName" $root }}
                  key: plex-claim-token
                  optional: true
            {{- with $cfg.noAuthNetworks }}
            - name: PLEX_NO_AUTH_NETWORKS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- else if eq $inst.app "qui" }}
            - name: QUI__HOST
              value: 0.0.0.0
            - name: QUI__PORT
              value: {{ $cfg.port | quote }}
            # qui's own baseUrl, not a stripped prefix: it builds its asset URLs
            # under it, so the route keeps the path and rewritePath stays false.
            - name: QUI__BASE_URL
              value: {{ $urlBase | quote }}
            # qui's login is off, like the Arrs' External scheme: the login is at
            # the edge (auth.edge), never in the app. Disabling it takes three
            # settings (internal/domain/config.go at v1.35.0: IsAuthDisabled is
            # AuthDisabled && IAcknowledgeThisIsABadIdea, and
            # ValidateAuthDisabledConfig refuses to start without the allowlist).
            # The allowlist is every address because it can only ever match the
            # TCP peer: in front of this app that is the Gateway's proxy pod, not
            # the browser, and NetworkPolicy already admits only the Gateway and
            # this release. Plex's noAuthNetworks warning is the opposite case --
            # Plex sits outside the edge, so a range trusted there would open the
            # server itself to whoever reaches it. A pod that got past the
            # NetworkPolicy would already be inside the release.
            - name: QUI__AUTH_DISABLED
              value: "true"
            - name: QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA
              value: "true"
            - name: QUI__AUTH_DISABLED_ALLOWED_CIDRS
              value: "0.0.0.0/0,::/0"
            {{- else if eq $inst.app "maintainerr" }}
            - name: UI_HOSTNAME
              value: 0.0.0.0
            - name: UI_PORT
              value: {{ $cfg.port | quote }}
            # Maintainerr applies its global prefix to every route, health and
            # API included, so its own BASE_PATH does the work and the route
            # keeps the prefix.
            - name: BASE_PATH
              value: {{ $urlBase | quote }}
            # One directory holds everything it writes: the SQLite database,
            # logs, overlays and the UI bundle start.sh stages on every boot.
            # DATA_DIR moves that directory, so /config (the subPath mount) is
            # enough and no second mount branch is needed. The staged UI is why
            # it has to be writable, not merely readable.
            - name: DATA_DIR
              value: /config
            # A weekly usage report to the vendor is not a default anyone here
            # chose. TELEMETRY=off is the app's own switch, and it wins over the
            # in-app setting.
            - name: TELEMETRY
              value: "off"
            {{- end }}
            {{- range $k, $v := $cfg.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
            {{- if eq $inst.app "qbittorrent" }}
            - name: bt-tcp
              containerPort: {{ $cfg.torrent.port }}
              protocol: TCP
            - name: bt-udp
              containerPort: {{ $cfg.torrent.port }}
              protocol: UDP
            {{- end }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            {{- if $inst.arr }}
            httpGet:
              path: {{ printf "%s/ping" $urlBase }}
              port: http
            {{- else if $path := include "s5n.readinessPath" (dict "app" $inst.app "name" $inst.name) }}
            httpGet:
              path: {{ $path }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              {{- if eq $inst.app "seerr" }}
              # Seerr keeps its database, settings and rotated logs in
              # CONFIG_DIRECTORY, which its image defaults to /app/config.
              # Mounting the claim at /config would leave that on the read-only
              # root filesystem, which is an EROFS crash at start-up; this is
              # the one app whose config path is not /config.
              mountPath: /app/config
              {{- else }}
              mountPath: /config
              {{- end }}
              subPath: {{ $inst.name }}
            - name: tmp
              mountPath: /tmp
            {{- if eq $inst.app "plex" }}
            - name: transcode
              mountPath: /transcode
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "s5n.dataClaim" $root }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "s5n.configClaim" $root }}
        - name: tmp
          emptyDir: {}
        {{- if eq $inst.app "plex" }}
        - name: transcode
          emptyDir: {}
        {{- end }}
        {{- if eq $inst.app "qbittorrent" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: qbittorrent-password
                path: qbittorrent-password
        {{- else if eq $inst.app "tautulli" }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" $root }}
            defaultMode: 0440
            items:
              - key: tautulli-apikey
                path: tautulli-apikey
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  type: ClusterIP
  selector:
    {{- include "s5n.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $cfg.port }}
      targetPort: http
{{- if eq $inst.app "qbittorrent" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $inst.name }}-peers
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
  {{- with $cfg.torrent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $cfg.torrent.service.type }}
  {{- if ne $cfg.torrent.service.type "ClusterIP" }}
  externalTrafficPolicy: {{ $cfg.torrent.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "s5n.selector" $ctx | nindent 4 }}
  ports:
    - name: bt-tcp
      port: {{ $cfg.torrent.port }}
      targetPort: bt-tcp
      protocol: TCP
      {{- if eq $cfg.torrent.service.type "NodePort" }}
      nodePort: {{ $cfg.torrent.port }}
      {{- end }}
    - name: bt-udp
      port: {{ $cfg.torrent.port }}
      targetPort: bt-udp
      protocol: UDP
      {{- if eq $cfg.torrent.service.type "NodePort" }}
      nodePort: {{ $cfg.torrent.port }}
      {{- end }}
{{- end }}
{{- if $root.Values.gateway.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $inst.name }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $inst.name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $root.Values.gateway.parentRef.name }}
      namespace: {{ $root.Values.gateway.parentRef.namespace }}
      {{- with $root.Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- if eq $exposure "host" }}
  # This app's UI writes absolute asset paths, so it is served at a name of its
  # own (the catalog says so) and never under a prefix. The certificate and the
  # listeners for this name are root's, written from the grant by box.
  hostnames: [{{ $appHost | quote }}]
  {{- else }}
  {{- with $root.Values.gateway.host }}
  hostnames: [{{ . | quote }}]
  {{- end }}
  {{- end }}
  rules:
    {{- if and (eq $exposure "path") (eq $inst.app "maintainerr") }}
    # The live task stream is a Server-Sent Events connection that has to stay
    # open, and Envoy's route timeout defaults to 15s, which would cut it: the
    # UI's log and task views would go quiet with nothing in the logs to say
    # why. So this one path asks for no request timeout (Gateway API reads "0s"
    # as "none") and every other path keeps the default. Gateway API sends a
    # request to the rule with the longest matching path prefix, so the stream
    # takes this rule and the rest of /maintainerr the one below.
    - matches:
        - path:
            type: PathPrefix
            value: {{ printf "%s/api/events/stream" $urlBase }}
      timeouts:
        request: 0s
      backendRefs:
        - name: {{ $inst.name }}
          port: {{ $cfg.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            {{- if eq $exposure "host" }}
            value: /
            {{- else }}
            value: {{ $urlBase }}
            {{- end }}
      {{- if and (eq $exposure "path") $cfg.rewritePath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - name: {{ $inst.name }}
          port: {{ $cfg.port }}
{{- end }}
{{- end }}
