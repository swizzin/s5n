{{- /* Arr API keys, generated on first install and preserved on every upgrade via lookup, so
       the wiring Job and the apps always agree. Never rendered into values or ConfigMaps.
       `lookup` answers nothing under `helm template` / --dry-run, so offline renders show
       fresh keys; only a live install or upgrade preserves them. */}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "s5n.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* A release that runs nothing renders the Secret with no keys, which the API server
       stores as a null data map. A later render -- a rehearsal's lock apply, an apply after
       every app was switched off -- must not trip on that: an absent map means there is no
       key to preserve, not that the render fails. */}}
{{- $data := dict }}
{{- with $existing }}{{- with .data }}{{- $data = . }}{{- end }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $inst := include "s5n.instances" . | fromJsonArray }}
  {{- /* Every app whose API key the chart mints: the Arrs, Bazarr and SABnzbd, whose init
         containers seal this one into a file the app reads. */}}
  {{- if or $inst.arr (eq $inst.app "bazarr") (eq $inst.app "sabnzbd") }}
  {{- $key := printf "%s-apikey" $inst.name }}
  {{ $key }}: {{ (index $data $key) | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- end }}
  {{- if and .Values.apps.qbittorrent .Values.apps.qbittorrent.enabled }}
  qbittorrent-password: {{ (index $data "qbittorrent-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /* The automation account's passwords: qui and autobrr hand out an API key only to a
         signed-in session, so each init container writes this password into the app's user
         table on every start and the wiring Job signs in with it. Generated once and preserved,
         like the qBittorrent password. */}}
  {{- if and .Values.apps.qui .Values.apps.qui.enabled }}
  qui-password: {{ (index $data "qui-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- if and .Values.apps.autobrr .Values.apps.autobrr.enabled }}
  autobrr-password: {{ (index $data "autobrr-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /* PeerBanHelper's WebUI token: the chart gives it to the app through its environment
         (PBH_APITOKEN, the switch in front of server.token) and to the wiring Job through this
         key, so neither writes it into the app's config file and a first start has no OOBE step. */}}
  {{- if and .Values.apps.pbh .Values.apps.pbh.enabled }}
  pbh-token: {{ (index $data "pbh-token") | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
  {{- if and .Values.apps.tautulli .Values.apps.tautulli.enabled }}
  tautulli-apikey: {{ (index $data "tautulli-apikey") | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- /* Jellyfin keeps its accounts in jellyfin.db, so nothing here is sealed into a file
         before it starts: its init container completes the first-run wizard, and these two keys
         are the passwords it sets.

         jellyfin-user-password is the person's account, generated here and preserved by the
         lookup; box reads it back from the release Secret on the one apply that created it and
         shows it once, and a plain `helm install` reads it from the Secret.
         jellyfin-box-password is the automation account the wiring Job signs in as, never shown.

         Both are mounted into the init container and the Job; the app itself never sees either. */}}
  {{- if and .Values.apps.jellyfin .Values.apps.jellyfin.enabled }}
  jellyfin-user-password: {{ (index $data "jellyfin-user-password") | default (randAlphaNum 24 | b64enc) }}
  jellyfin-box-password: {{ (index $data "jellyfin-box-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /* plex-token is the Plex server token the wiring Job hands Tautulli. Optional: without it
         tautulli/plex is reported pending, never tokenless. A value in .Values.secrets.plexToken
         wins (a rotation), an existing key is preserved, and box fills it in from Plex's own
         Preferences.xml on an apply that finds it missing. */}}
  {{- $plexToken := index $data "plex-token" }}
  {{- with .Values.secrets.plexToken }}
  {{- $plexToken = . | b64enc }}
  {{- end }}
  {{- with $plexToken }}
  plex-token: {{ . }}
  {{- end }}
  {{- /* plex-claim-token is never generated here: it expires about four minutes after issue at
         https://plex.tv/claim, so it can only be supplied at install time (box init asks for it
         last; see catalog.yaml and docs/box.md). A non-empty .Values.secrets.plexClaimToken, or
         a key patched into the live Secret, which the lookup preserves. Its absence is normal:
         Plex comes up unclaimed and only exchanges the token while it is unclaimed. */}}
  {{- $claimToken := index $data "plex-claim-token" }}
  {{- with .Values.secrets.plexClaimToken }}
  {{- $claimToken = . | b64enc }}
  {{- end }}
  {{- with $claimToken }}
  plex-claim-token: {{ . }}
  {{- end }}
{{- end }}
