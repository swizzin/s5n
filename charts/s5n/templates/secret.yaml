{{- /*
Arr API keys, generated on first install and preserved on every upgrade via lookup,
so the wiring Job and the apps always agree. Never rendered into values or ConfigMaps.
Note: lookup returns nothing under `helm template` / --dry-run, so offline renders show
fresh keys every time; only a live install/upgrade preserves them.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "s5n.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* A release that runs nothing renders the Secret with no keys, which the
API server stores as a null data map. A later render -- a rehearsal's lock
apply, an apply after every app was switched off -- must not trip on that: an
absent map means there is no key to preserve, not that the render fails. */ -}}
{{- $data := dict }}
{{- with $existing }}{{- with .data }}{{- $data = . }}{{- end }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $inst := include "s5n.instances" . | fromJsonArray }}
  {{- /* Every app whose API key the chart mints for it: the Arrs (the Job and
         Prowlarr use theirs), Bazarr, whose init container seals this one into
         a file the app reads, and SABnzbd, whose init container seals it into
         sabnzbd.ini and whose own entrypoint re-applies it from the environment
         on every start. */}}
  {{- if or $inst.arr (eq $inst.app "bazarr") (eq $inst.app "sabnzbd") }}
  {{- $key := printf "%s-apikey" $inst.name }}
  {{ $key }}: {{ (index $data $key) | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- end }}
  {{- if and .Values.apps.qbittorrent .Values.apps.qbittorrent.enabled }}
  qbittorrent-password: {{ (index $data "qbittorrent-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /*
  The automation account's passwords: qui and autobrr hand out an API key only
  to a signed-in session, so each app's own init container writes this password
  into the app's user table on every start and the wiring Job signs in with it.
  Generated once here and preserved through lookup, like the qBittorrent
  password; no other store holds it.
  */}}
  {{- if and .Values.apps.qui .Values.apps.qui.enabled }}
  qui-password: {{ (index $data "qui-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- if and .Values.apps.autobrr .Values.apps.autobrr.enabled }}
  autobrr-password: {{ (index $data "autobrr-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /*
  PeerBanHelper's WebUI token. The chart gives it to the app through its
  environment (PBH_APITOKEN, the switch in front of server.token) and to the
  wiring Job through this key, so neither writes it into the app's config file
  and a first start has no OOBE step. Generated once and preserved through
  lookup like every other key here.
  */}}
  {{- if and .Values.apps.pbh .Values.apps.pbh.enabled }}
  pbh-token: {{ (index $data "pbh-token") | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
  {{- if and .Values.apps.tautulli .Values.apps.tautulli.enabled }}
  tautulli-apikey: {{ (index $data "tautulli-apikey") | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- /*
  Jellyfin keeps its accounts in jellyfin.db, so nothing here can be sealed into
  a file before it starts: the app's own init container completes the first-run
  wizard, and these two keys are the passwords it sets.

    jellyfin-user-password  the person's account, the one their players sign in
                            with. It is generated here and preserved by the
                            lookup like every key above; box reads it back from
                            the release Secret on the one apply that created it
                            and shows it once. A plain `helm install` reads it
                            from this Secret (kubectl get secret <release>-keys)
                            and never sees it in a values file or an output line.
    jellyfin-box-password   the automation account the wiring Job signs in as.
                            It is generated here and never shown: nothing but
                            the Job uses it.

  Both are mounted into the app's init container and the Job; the app itself
  never sees either.
  */}}
  {{- if and .Values.apps.jellyfin .Values.apps.jellyfin.enabled }}
  jellyfin-user-password: {{ (index $data "jellyfin-user-password") | default (randAlphaNum 24 | b64enc) }}
  jellyfin-box-password: {{ (index $data "jellyfin-box-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- /*
  plex-token is the Plex server token the wiring Job hands Tautulli for its PMS
  link. Optional: without it tautulli/plex is reported pending, never tokenless.
  A value supplied in .Values.secrets.plexToken wins (that is how a rotation is
  applied); otherwise an existing key in the live Secret is preserved, the same
  way a hand-patched plex-claim-token survives an upgrade. box fills it in from
  Plex's own Preferences.xml on an apply that finds it missing, so a box claimed
  after it was installed needs no hand-patched Secret.
  */}}
  {{- $plexToken := index $data "plex-token" }}
  {{- with .Values.secrets.plexToken }}
  {{- $plexToken = . | b64enc }}
  {{- end }}
  {{- with $plexToken }}
  plex-token: {{ . }}
  {{- end }}
  {{- /*
  plex-claim-token is never generated here: it expires about four minutes after
  it is issued at https://plex.tv/claim, so it can only be supplied at install
  time (box init asks for it last, after the confirm, and hands it to that one
  apply; see catalog.yaml and docs/box.md). The two ways in are a non-empty
  .Values.secrets.plexClaimToken -- how `box init` and a plain `helm install`
  supply it -- and a key patched into the live Secret, which the lookup above
  preserves across every upgrade. Its absence is normal, not an error: Plex
  comes up unclaimed and its pod's optional secretKeyRef stays empty. Plex only
  exchanges the token while its server is unclaimed, so a value arriving after
  the first start changes nothing.
  */}}
  {{- $claimToken := index $data "plex-claim-token" }}
  {{- with .Values.secrets.plexClaimToken }}
  {{- $claimToken = . | b64enc }}
  {{- end }}
  {{- with $claimToken }}
  plex-claim-token: {{ . }}
  {{- end }}
{{- end }}
