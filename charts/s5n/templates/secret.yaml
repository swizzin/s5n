{{- /*
Arr API keys, generated on first install and preserved on every upgrade via lookup,
so the wiring Job and the apps always agree. Never rendered into values or ConfigMaps.
Note: lookup returns nothing under `helm template` / --dry-run, so offline renders show
fresh keys every time; only a live install/upgrade preserves them.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "s5n.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $inst := include "s5n.instances" . | fromJsonArray }}
  {{- if $inst.arr }}
  {{- $key := printf "%s-apikey" $inst.name }}
  {{ $key }}: {{ (index $data $key) | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- end }}
  {{- if and .Values.apps.qbittorrent .Values.apps.qbittorrent.enabled }}
  qbittorrent-password: {{ (index $data "qbittorrent-password") | default (randAlphaNum 24 | b64enc) }}
  {{- end }}
  {{- if and .Values.apps.tautulli .Values.apps.tautulli.enabled }}
  tautulli-apikey: {{ (index $data "tautulli-apikey") | default (randAlphaNum 32 | lower | b64enc) }}
  {{- end }}
  {{- /*
  plex-token is the Plex server token the wiring Job hands Tautulli for its PMS
  link. Optional: without it tautulli/plex is reported pending, never tokenless.
  A value supplied in .Values.secrets.plexToken wins (that is how a rotation is
  applied); otherwise an existing key in the live Secret is preserved, the same
  way a hand-patched plex-claim-token survives an upgrade.
  */}}
  {{- $plexToken := index $data "plex-token" }}
  {{- with .Values.secrets.plexToken }}
  {{- $plexToken = . | b64enc }}
  {{- end }}
  {{- with $plexToken }}
  plex-token: {{ . }}
  {{- end }}
  {{- /*
  plex-claim-token is never generated here: it expires about four minutes after
  it is issued at https://plex.tv/claim, so it can only be supplied at install
  time (box init asks for it last, after the confirm, and hands it to that one
  apply; see catalog.yaml and docs/box.md). The two ways in are a non-empty
  .Values.secrets.plexClaimToken -- how `box init` and a plain `helm install`
  supply it -- and a key patched into the live Secret, which the lookup above
  preserves across every upgrade. Its absence is normal, not an error: Plex
  comes up unclaimed and its pod's optional secretKeyRef stays empty. Plex only
  exchanges the token while its server is unclaimed, so a value arriving after
  the first start changes nothing.
  */}}
  {{- $claimToken := index $data "plex-claim-token" }}
  {{- with .Values.secrets.plexClaimToken }}
  {{- $claimToken = . | b64enc }}
  {{- end }}
  {{- with $claimToken }}
  plex-claim-token: {{ . }}
  {{- end }}
{{- end }}
