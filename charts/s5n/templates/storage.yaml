{{- /*
Data and config claims. Precedence: existingClaim > storageClass > hostPath.
hostPath mode creates a static, Retain-policy PV bound to exactly one claim, so the
hostPath never appears in a pod spec and Pod Security "restricted" still admits the pods.
*/ -}}
{{- $root := . -}}
{{- range $kind := list "data" "config" }}
{{- $s := index $root.Values.storage $kind }}
{{- if not $s.existingClaim }}
{{- $claim := printf "%s-%s" (include "s5n.fullname" $root) $kind }}
{{- $pvName := printf "%s-%s-%s" $root.Release.Namespace (include "s5n.fullname" $root) $kind }}
{{- if not $s.storageClass }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pvName }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ $s.size }}
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  claimRef:
    namespace: {{ $root.Release.Namespace }}
    name: {{ $claim }}
  hostPath:
    path: {{ required (printf "storage.%s.hostPath is required when no storageClass or existingClaim is set" $kind) $s.hostPath }}
    type: Directory
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels:
    {{- include "s5n.labels" $root | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ ternary "ReadWriteMany" "ReadWriteOnce" (not $s.storageClass) | quote }}]
  storageClassName: {{ $s.storageClass | quote }}
  {{- if not $s.storageClass }}
  volumeName: {{ $pvName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $s.size }}
{{- end }}
{{- end }}
