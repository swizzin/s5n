{{- /*
The wiring Job: Helm post-install / post-upgrade hook.

It reads a rendered config (URLs, categories, paths, and file paths into the
mounted Secret — never the secrets themselves), reconciles the apps into the s5n
data contract, proves hardlinks on /data, and writes its receipt into
`<release>-wiring` under status.json / summary.txt.

The Job pod uses the ServiceAccount below, whose only permission is that one
ConfigMap. It is not tracked by Helm, so `helm upgrade` replaces it and the
previous run's logs stay readable until then.
*/ -}}
{{- if .Values.wiring.enabled }}
{{- $root := . }}
{{- $name := printf "%s-wiring" (include "s5n.fullname" .) }}

{{- /* Every Bazarr instance and the Arr pair it reads (s5n.bazarrs): a pair
       is resolved from the enabled instances, so a Bazarr whose sonarr-4k is
       switched off reads the Radarr alone. Built here rather than in
       workloads.yaml because this is the only consumer; the guard is for the
       release's shape, not for this Job. */ -}}
{{- $bazarrs := list }}
{{- range $bz := include "s5n.bazarrs" . | fromJsonArray }}
{{- $entry := dict
      "name" $bz.name
      "url" (printf "http://%s:%v" $bz.name $bz.port)
      "urlBase" (printf "/%s" $bz.name)
      "apiKeyFile" (printf "/etc/s5n/keys/%s-apikey" $bz.name) }}
{{- /* Only the sides this release runs become keys. sprig's `get` answers ""
       for a key that is not there, and an empty string is not the nil the Job
       reads as "this box runs no such Arr": hasKey is what tells them apart. */}}
{{- range $side := list "sonarr" "radarr" }}
{{- if hasKey $bz $side }}
{{- $_ := set $entry $side (get $bz $side) }}
{{- end }}
{{- end }}
{{- $bazarrs = append $bazarrs $entry }}
{{- end }}

{{- /* One entry per enabled Arr instance. */ -}}
{{- $instances := list }}
{{- range $inst := include "s5n.instances" . | fromJsonArray }}
{{- /* Prowlarr also carries an API key, but it is not an Arr instance. */ -}}
{{- if and $inst.arr (ne $inst.app "prowlarr") }}
{{- $instances = append $instances (dict
      "name" $inst.name
      "kind" $inst.app
      "url" (printf "http://%s:%v" $inst.name $inst.cfg.port)
      "urlBase" (printf "/%s" $inst.name)
      "apiKeyFile" (printf "/etc/s5n/keys/%s-apikey" $inst.name)
      "category" $inst.category
      "downloadCategory" $inst.downloadCategory
      "savePath" (printf "/data/downloads/%s" $inst.downloadCategory)
      "rootFolder" (printf "/data/media/%s" $inst.category)) }}
{{- end }}
{{- end }}

{{- $cfg := dict
      "namespace" .Release.Namespace
      "configMap" $name
      "timeoutSeconds" .Values.wiring.timeoutSeconds
      "instances" $instances }}
{{- /* The key exists only when a Bazarr does: a release without one renders the
       config it always has, and the Job reads an absent list as none. */ -}}
{{- if $bazarrs }}
{{- $_ := set $cfg "bazarrs" $bazarrs }}
{{- end }}
{{- if and .Values.apps.qbittorrent .Values.apps.qbittorrent.enabled }}
{{- /* The WebUI skips its login for the release's addresses (the init container
       seals that), so this Job -- like every app that calls it -- carries no
       credential at all: the URL is the whole entry. */}}
{{- /* savePath is the data contract's downloads root, which a category with
       no save path of its own downloads into: a migrated category is that
       shape, and the Job must leave it alone. */}}
{{- $_ := set $cfg "qbittorrent" (dict
      "url" (printf "http://qbittorrent:%v" .Values.apps.qbittorrent.port)
      "savePath" "/data/downloads") }}
{{- end }}
{{- if and .Values.apps.sabnzbd .Values.apps.sabnzbd.enabled }}
{{- /* The usenet download client. The Job creates a category per Arr instance
       under its complete_dir and registers the client in every Arr, so this
       block is the whole address plus the two paths the data contract gives it.
       downloadDir is the temporary tree: SAB moves a finished job from there to
       complete_dir, and both are on /data, so the move is a rename and an
       Arr's import is a hardlink. */}}
{{- $_ := set $cfg "sabnzbd" (dict
      "url" (printf "http://sabnzbd:%v" .Values.apps.sabnzbd.port)
      "urlBase" "/sabnzbd"
      "apiKeyFile" "/etc/s5n/keys/sabnzbd-apikey"
      "savePath" "/data/downloads"
      "downloadDir" "/data/downloads/incomplete") }}
{{- end }}
{{- if and .Values.apps.prowlarr .Values.apps.prowlarr.enabled }}
{{- $_ := set $cfg "prowlarr" (dict
      "url" (printf "http://prowlarr:%v" .Values.apps.prowlarr.port)
      "urlBase" "/prowlarr"
      "selfUrl" (printf "http://prowlarr:%v/prowlarr" .Values.apps.prowlarr.port)
      "apiKeyFile" "/etc/s5n/keys/prowlarr-apikey") }}
{{- end }}
{{- if and .Values.apps.plex .Values.apps.plex.enabled }}
{{- $_ := set $cfg "plex" (dict
      "url" (printf "http://plex:%v" .Values.apps.plex.port)) }}
{{- end }}
{{- if and .Values.apps.tautulli .Values.apps.tautulli.enabled }}
{{- /* The URL carries the prefix the route keeps: the app's own http_root is
       sealed to it by the init container, so its API lives at /tautulli/api/v2
       and the root of the pod's port is only a redirect. plexTokenFile may
       legitimately not exist yet: the PMS link then reports pending instead of
       being configured against a Plex that trusts the pod network. */}}
{{- $_ := set $cfg "tautulli" (dict
      "url" (printf "http://tautulli:%v/tautulli" .Values.apps.tautulli.port)
      "apiKeyFile" "/etc/s5n/keys/tautulli-apikey"
      "plexTokenFile" "/etc/s5n/keys/plex-token") }}
{{- end }}
{{- if and .Values.apps.maintainerr .Values.apps.maintainerr.enabled }}
{{- /* Maintainerr's BASE_PATH is set from the instance name and applies to its
       API and its health route alike, so this Job's paths carry the prefix. Its
       Plex connection is written through the API, with the same server token
       Tautulli's PMS link takes; without one the row is pending, never a
       connection with no credential. */}}
{{- $_ := set $cfg "maintainerr" (dict
      "url" (printf "http://maintainerr:%v" .Values.apps.maintainerr.port)
      "urlBase" "/maintainerr"
      "plexTokenFile" "/etc/s5n/keys/plex-token") }}
{{- end }}
{{- if and .Values.apps.seerr .Values.apps.seerr.enabled }}
{{- /* The publicUrl is where a person opens Seerr, not where this Job dials it:
       Seerr's bundle loads its assets from the site root, so the chart serves it
       at <app>.<domain> (catalog.yaml's exposure), and the one row that asks a
       human to sign in there has to name that address rather than the Service. */}}
{{- $_ := set $cfg "seerr" (dict
      "url" (printf "http://seerr:%v" .Values.apps.seerr.port)
      "publicUrl" (include "s5n.appHost" (dict "root" . "app" "seerr") | trim)) }}
{{- end }}
{{- if and .Values.apps.qui .Values.apps.qui.enabled }}
{{- /* qui keeps its own user table: the account the chart owns is what this
       sign-in uses (s5n.wiringAccount), and the password is a file reference
       into the mounted Secret like every other credential here. */}}
{{- $_ := set $cfg "qui" (dict
      "url" (printf "http://qui:%v" .Values.apps.qui.port)
      "urlBase" "/qui"
      "username" (include "s5n.wiringAccount" $root | trim)
      "passwordFile" "/etc/s5n/keys/qui-password") }}
{{- end }}
{{- if and .Values.apps.autobrr .Values.apps.autobrr.enabled }}
{{- /* Same account arrangement as qui's. autobrr's base URL carries a trailing
       slash in its own setting, but its API routes are mounted under baseUrl
       plus "/api", so the path this client appends is "/autobrr/api/...". */}}
{{- $_ := set $cfg "autobrr" (dict
      "url" (printf "http://autobrr:%v" .Values.apps.autobrr.port)
      "urlBase" "/autobrr"
      "username" (include "s5n.wiringAccount" $root | trim)
      "passwordFile" "/etc/s5n/keys/autobrr-password") }}
{{- end }}
{{- if and .Values.apps.pbh .Values.apps.pbh.enabled }}
{{- /* PBH's downloader is the release's qBittorrent, and the token is the same
       WebUI token the app was given through its environment. */}}
{{- $_ := set $cfg "pbh" (dict
      "url" (printf "http://pbh:%v" .Values.apps.pbh.port)
      "tokenFile" "/etc/s5n/keys/pbh-token") }}
{{- end }}
{{- if and .Values.apps.jellyfin .Values.apps.jellyfin.enabled }}
{{- /* Jellyfin keeps its accounts, its API keys and its library paths in
       jellyfin.db, so nothing can be sealed into a file before it starts. The
       app's own init container completes the first-run wizard before the app
       container starts, so this Job only checks that it is complete; `username`
       is the account root's login admits, the name the wizard gives the person's
       account, and the two passwords are file references into the mounted
       Secret, never values here.

       The libraries are one per Arr instance: the same library directory
       directories this run creates (the dirs step), with the collection type
       that Arr writes. Nothing else in the release adds a library, so this list
       is the whole of what the server has. */}}
{{- $collections := dict "sonarr" "tvshows" "radarr" "movies" "lidarr" "music" }}
{{- $libraries := list }}
{{- range $inst := include "s5n.instances" . | fromJsonArray }}
{{- if and $inst.arr (ne $inst.app "prowlarr") }}
{{- $libraries = append $libraries (dict
      "name" $inst.name
      "collectionType" (get $collections $inst.app)
      "path" (printf "/data/media/%s" $inst.category)) }}
{{- end }}
{{- end }}
{{- $_ := set $cfg "jellyfin" (dict
      "url" (printf "http://jellyfin:%v" .Values.apps.jellyfin.port)
      "username" (required "login: Jellyfin's first account is the person's, named after the box login; box writes it into the release values" .Values.login)
      "userPasswordFile" "/etc/s5n/keys/jellyfin-user-password"
      "boxPasswordFile" "/etc/s5n/keys/jellyfin-box-password"
      "knownProxies" (.Values.apps.jellyfin.knownProxies | default list)
      "libraries" $libraries) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
data:
  wiring.json: |
    {{- toJson $cfg | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
rules:
  # RBAC cannot scope `create` by resourceNames (the object has no name until it
  # exists), so this verb covers any ConfigMap in the namespace. The Job only ever
  # creates its own receipt, and only when `helm uninstall` has left it absent.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "s5n.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.wiring.backoffLimit }}
  activeDeadlineSeconds: {{ add .Values.wiring.timeoutSeconds 120 }}
  template:
    metadata:
      labels:
        {{- include "s5n.labels" $root | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
        s5n.io/role: wiring
      {{- with .Values.wiring.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      # This pod needs the API to publish its receipt; every app pod explicitly
      # does not get a token.
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: {{ $name }}
      securityContext:
        {{- include "s5n.podSecurity" $root | nindent 8 }}
      containers:
        - name: wiring
          image: {{ include "s5n.image" (dict "root" $root "app" "s5n" "path" "wiring.image" "image" .Values.wiring.image) }}
          imagePullPolicy: IfNotPresent
          args: ["wiring", "--config=/etc/s5n/wiring/wiring.json"]
          env:
            - name: TZ
              value: {{ .Values.global.tz | quote }}
          securityContext:
            {{- include "s5n.containerSecurity" $root | nindent 12 }}
          {{- with .Values.wiring.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wiring
              mountPath: /etc/s5n/wiring
              readOnly: true
            - name: keys
              mountPath: /etc/s5n/keys
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: wiring
          configMap:
            name: {{ $name }}
        - name: keys
          secret:
            secretName: {{ include "s5n.secretName" . }}
            # fsGroup makes the release's gid the group owner; group read is what
            # lets the non-root process read the keys.
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "s5n.dataClaim" . }}
{{- end }}
