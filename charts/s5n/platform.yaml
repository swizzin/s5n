# Every version box installs, in one file, shipped inside the chart release (docs/box.md,
# "The platform layer"). box reads it from the release it pulled, like variants.yaml:
# nothing is compiled in, so a chart release carries the platform it installs.
# `go run ./hack/versions` prints these for the e2e, and .github/renovate.json opens one
# pull request per upstream release, so the e2e tests exactly what a release ships.
#
# A value is the version as the upstream artefact publishes it: k0s's release tag, the
# chart's own version, or -- for the login, whose Deployment box writes -- the whole image
# reference. Nothing adds or strips a leading "v": internal/platform.AtPin compares as
# semver.
#
# k0s's checksums sit beside its version because they are the same pin: what box downloads
# runs as root, so a sum kept elsewhere could disagree with the version it sits next to.
# They are not versions, so they carry no Renovate marker; `go run ./hack/k0s-sums --check`
# is what CI runs, and .github/workflows/k0s-sums.yaml writes them on a Renovate pull
# request.
#
# The comment on each line is the pin's source, which is what Renovate reads: one line, one
# pin, one bump. Chart refs are not versions and stay in internal/platform/platform.go, and
# versions that exist only for tests stay in the scripts, pinned by digest.
authelia: "docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54"  # renovate: datasource=docker depName=authelia/authelia
k0s: v1.37.2+k0s.1       # renovate: datasource=github-releases depName=k0sproject/k0s
k0sSHA256amd64: "4770cf89ff45e43292819f6e3a02a25a453bc750c777f6f7ad2de335f3f41df5"
k0sSHA256arm64: "d04426041ef9ac002b957fbf43fc36dd736398147db7589fad53687753bedd52"
envoyGateway: 1.10.0       # renovate: datasource=docker depName=envoyproxy/gateway-helm
metallb: 0.16.2           # renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb
