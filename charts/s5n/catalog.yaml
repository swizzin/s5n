# The catalog: every app a seedbox can run, and the setup questions `box init`
# asks for it.
#
# The chart owns this file, the same way it owns variants.yaml: it ships inside
# the chart archive and `--set` or a values file cannot add to it, change it or
# override it. box reads it from the chart release it is installing, so adding
# an app does not need a box release -- one entry here, one entry under `apps:`
# in values.yaml, its values.schema.json definition, and, if the app needs
# connecting to the others, a wiring step in the s5n image.
#
# Every app under `apps:` in values.yaml has exactly one entry below and vice
# versa. internal/catalog refuses a manifest that disagrees, and refuses a
# question whose key is not a chart value or is a grant key: the grant (domain,
# paths, uid, the app list) is box's own question, never a manifest's. So a
# question may only name a key the *user* owns.
#
# A question is:
#   key       the chart values path the answer is written to
#   prompt    the line `box init` shows
#   help      one optional line under the prompt (why, or where to get it)
#   kind      one of:
#               string     free text
#               secret     masked input; written to the values file, never echoed
#                          and never printed in an apply diff
#               bool       yes or no
#               transient  a secret that outlives no file: asked last, after
#                          apply's confirm, handed to that one apply and never
#                          written to values or the grant. The Plex claim token
#                          is the case: it expires about four minutes after
#                          https://plex.tv/claim issues it, so it can only be
#                          supplied at install time. A transient key still has
#                          to exist in values.schema.json, because it is passed
#                          to the chart.
#   default   a starting answer; must match the kind
#   optional  an empty answer is allowed (the app copes without it)
#
# An entry also says how the chart serves the app:
#
#   exposure: path   under /<name> on the box's own host name (the default)
#   exposure: host   at <app>.<domain>, with its own listener and certificate,
#                    for a UI that writes absolute asset paths and so cannot
#                    live under a prefix. The chart owns this decision; it is
#                    not a values key, because a user choosing it wrongly is a
#                    broken UI, not tuning. `box init` resolves each such name
#                    and checks it answers where the domain does before it
#                    writes anything for it (docs/box.md, "Certificates").
#
# And how a person gets into it:
#
#   login: portal    behind the box's one login (the default): the edge asks
#                    for a session before it serves the app.
#   login: own       the app signs its users in itself, on whatever name or
#                    path it is served at, so that host or prefix bypasses the
#                    login. It is for an app whose clients can't answer a
#                    login page: a media server serving its own players by
#                    its own token, or a tool those players and API clients
#                    reach.
#
# An entry also says what the app dials *inside* the release:
#
#   calls: [qbittorrent, prowlarr]   the in-release apps it connects to
#
# It is the one list for that, and the chart derives the release's NetworkPolicy
# from it: each app's ingress admits exactly the enabled apps that name it, so an
# app that is switched off admits nothing and is admitted by nothing. Naming a
# peer is what opens the peer's ingress; the release's own egress is open either
# way, so a call this list forgets is refused at the callee and nowhere else.
# "sonarr"/"radarr" mean every instance of that Arr. An app that calls nothing
# inside the release omits the key. A name here must be a catalog app, and no
# app calls itself.
#
# An entry also says what an image upgrade can rewrite beyond going back, so a
# failed update can put it back:
#
#   snapshot: [sonarr.db, sonarr.db-wal, sonarr.db-shm, config.xml]
#
# A list of globs in path.Match syntax, relative to the app's config directory
# (the /config mount), each matched against a whole relative path: `*` does not
# cross a `/`, and there is no `**`. Name the database a migration moves
# forward, the settings file a new version rewrites, and the SQLite companions
# (`-wal`, `-shm`) that belong with the database; never a cache, a log, media
# covers or Plex's metadata bundles. An app without the key has nothing to put
# back, which is right for one whose upgrades only add.
#
# A new *kind* of question is the only catalog change that needs a box release
# (docs/box.md, "The catalog and box").
apps:
  qbittorrent:
    description: the download client; it seeds what the Arrs grab
    instances: false
    default: true
    # The download client is called, and calls nothing inside the release: its
    # trackers and RSS feeds are outside it.
    #
    # No questions. Nobody logs in to qBittorrent any more: the WebUI skips its
    # login for the release's addresses and the edge's login is the one a person
    # uses, so the account the init container seals needs no answer from them.
    # The values key stays, with its "admin" default, because the init container
    # still writes a username into qBittorrent.conf (a chart value an existing
    # seedbox may already carry; removing it would break its schema).
    #
    # Its own settings upgrade renames and drops keys and records the version it
    # reached (src/app/upgrade.cpp at release-5.3.0: MIGRATION_VERSION and
    # handleSettingKeys), so a qBittorrent.conf is not readable by an older
    # version once a newer one has opened it.
    snapshot: [qBittorrent/qBittorrent.conf]
    questions: []

  sonarr:
    description: TV, from the tracker to the library
    instances: true
    default: true
    # Its download client, and Prowlarr: Prowlarr syncs each indexer into the
    # Arr with the indexer's base URL rewritten to <prowlarr>/<indexer id>/, so
    # a search is an HTTP call from the Arr's pod to Prowlarr
    # (Prowlarr v2.7, src/NzbDrone.Core/Applications/Sonarr/Sonarr.cs).
    calls: [qbittorrent, prowlarr]
    # An Arr's database and the config.xml that points at it, with the SQLite
    # companions a migration writes beside them (PathExtensions.cs at
    # v5.0.0.2907: the DB constant, GetDatabase and GetConfigPath). The log
    # database and MediaCover are not state a migration moves.
    snapshot: [sonarr.db, sonarr.db-wal, sonarr.db-shm, config.xml]
    # An Arr's second instance (an HD and a 4K Sonarr) is a grant decision, not
    # a values question: `box install sonarr --instance 4k` writes it.
    questions: []

  radarr:
    description: films, from the tracker to the library
    instances: true
    default: true
    # The same two as Sonarr, for the same reason
    # (src/NzbDrone.Core/Applications/Radarr/Radarr.cs).
    calls: [qbittorrent, prowlarr]
    # The same as Sonarr (PathExtensions.cs at v7.0.0.10815: radarr.db,
    # config.xml).
    snapshot: [radarr.db, radarr.db-wal, radarr.db-shm, config.xml]
    questions: []

  prowlarr:
    description: one indexer list, kept in sync with the Arrs
    instances: false
    default: true
    # It pushes indexers to the Arrs and tests each application it registers, so
    # the Arrs are what it dials. It has download clients of its own upstream,
    # but this chart configures none and nothing grabs through it.
    calls: [sonarr, radarr]
    # The same again (PathExtensions.cs at v2.7.0.5723: prowlarr.db,
    # config.xml).
    snapshot: [prowlarr.db, prowlarr.db-wal, prowlarr.db-shm, config.xml]
    questions: []

  plex:
    description: the media server your players talk to
    instances: false
    default: true
    # Plex calls nothing in the release: players are outside it, and Tautulli,
    # Seerr and Maintainerr are the ones that dial it.
    # Plex's web app writes absolute asset paths (/web/...), so it is served at
    # plex.<domain> rather than under /plex.
    exposure: host
    # Plex serves its own clients and issues its own token, so a login in front
    # of it would be a password no player asks for.
    login: own
    # The library database and the blobs beside it, and Preferences.xml, which
    # is what a Plex upgrade rewrites in a new shape. Its Metadata tree holds
    # covers, artwork and bundles: Plex rebuilds it, and copying it would mean
    # copying the whole library directory on every update. The image keeps
    # Plex's home under Library/Application Support in the claim (its
    # PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR), not at the top of /config.
    snapshot:
      - Library/Application Support/Plex Media Server/Preferences.xml
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db-wal
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db-shm
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-wal
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-shm
    questions:
      - key: secrets.plexClaimToken
        prompt: Plex claim token
        help: press enter to skip and claim the server yourself later; the token is at https://plex.tv/claim
        kind: transient
        optional: true

  tautulli:
    description: watch history and stats for Plex
    instances: false
    default: true
    # Its PMS link and its history both come from Plex's own API.
    calls: [plex]
    # It is behind the box's one login: `login: portal` is written out because
    # the name is in box's frozen legacy set, and an absent value there means
    # "own" for a chart that predates the key. Its own web login is switched off
    # by the app's init container (internal/ttlconf: a non-empty http_password
    # is what makes Tautulli ask for a password), and it is served under
    # /tautulli rather than at a name of its own.
    login: portal
    # Watch history and the config.ini that points at the database
    # (plexpy/database.py at v2.18.2: FILENAME = "tautulli.db";
    # plexpy/config.py: FILENAME = "config.ini").
    snapshot: [config.ini, tautulli.db, tautulli.db-wal, tautulli.db-shm]
    questions: []

  seerr:
    description: a request page for the people you share with
    instances: false
    default: true
    # Plex for the library and for signing people in, and both Arrs to add what
    # was requested. The Arrs are the callee side of this: their ingress is what
    # an unlisted caller never reaches, however open the release's egress is.
    calls: [plex, sonarr, radarr]
    # Same as Plex: Seerr's bundle loads its assets from the site root, so the
    # path route broke the page and it is served at seerr.<domain>.
    exposure: host
    # It signs people in with Plex, so a login here would be a second password.
    login: own
    # Its settings and its database, which Seerr keeps in a subdirectory of the
    # config directory (server/lib/settings/index.ts and server/datasource.ts at
    # v3.5.1: settings.json, db/db.sqlite3).
    snapshot: [settings.json, db/db.sqlite3, db/db.sqlite3-wal, db/db.sqlite3-shm]
    questions: []

  # Opt-in: a second UI for the same qBittorrent, not something a box should
  # have because it installed the defaults.
  qui:
    description: cross-seed and automation for qBittorrent, in one page
    instances: false
    default: false
    # qui speaks OIDC, so it signs in through the login's own provider rather
    # than sitting behind a login it cannot see. The chart is what gives it the
    # issuer and the client secret; this flag is what makes box register the
    # client, so a second app that speaks OIDC is one entry here (and the
    # chart's `oidc:` block beside it) rather than a box release.
    oidc: true
    # One qBittorrent, its own instance row.
    calls: [qbittorrent]
    # Its database and config.toml, which is where its session secret lives: the
    # credentials it stores in the database are encrypted with that value, so
    # the pair has to go back together (internal/config/config.go at v1.35.0:
    # resolveConfigPath and the qui.db path).
    snapshot: [config.toml, qui.db, qui.db-wal, qui.db-shm]
    questions: []

  # Opt-in: it watches IRC announces and feeds and hands what it finds to the
  # download client, and it is idle until the operator configures indexers by
  # hand -- not something a box should have because it installed the defaults.
  autobrr:
    description: grabs a release when it is announced, before the feed catches up
    instances: false
    default: false
    # autobrr speaks OIDC too, and only OIDC: at v1.90.0 it has no way to run
    # without a login of its own (no authDisabled, no trusted-header mode), so a
    # box that served it behind the edge alone would ask for two passwords. The
    # flag is the whole change: the chart wires the issuer, the secret and the
    # trust anchor from it, and box registers the client.
    oidc: true
    # Its download client, and every Arr its actions push to: autobrr's own
    # client test is an Arr API call, made from autobrr's pod. qui too: its
    # qBittorrent proxy is a download client autobrr can be pointed at, and a
    # missing edge here is a policy that drops that connection without a word.
    calls: [qbittorrent, qui, sonarr, radarr]
    # Its SQLite database and config.toml (internal/database/database.go at
    # v1.90.0: dataSourceName(cfg.ConfigPath, "autobrr.db");
    # internal/config/config.go: config.toml).
    snapshot: [config.toml, autobrr.db, autobrr.db-wal, autobrr.db-shm]
    questions: []

  # Opt-in: an anti-leech firewall for the download client. It reads
  # qBittorrent's own peer list and tells it to drop the peers its rules
  # reject, so it starts acting the moment it is connected -- not something a
  # box should have because it installed the defaults.
  pbh:
    description: drops the peers that cheat, leech or misbehave
    instances: false
    default: false
    # Its whole job: read the downloader's peers and drop what its rules ban.
    # Its GeoIP database and rule subscriptions come from the public internet,
    # which needs no entry here.
    calls: [qbittorrent]
    # Its WebUI fetches /api/... from the site root and builds asset URLs
    # relative to it, so it needs a host name of its own: pbh.<domain>.
    exposure: host
    # config.yml, which PBH's own migrations rewrite in place, and the database
    # in its persist directory (DatabaseDriverConfig.java and
    # SQLiteDatabaseDriver.java at v9.5.4, with the default sqlite type in
    # config.yml). The GeoIP database and the rule subscriptions are downloads
    # PBH fetches again, and the ban history is a log.
    snapshot: [config.yml, persist/peerbanhelper-nt.db, persist/peerbanhelper-nt.db-wal, persist/peerbanhelper-nt.db-shm]
    questions: []

  # Opt-in, and louder so: it deletes media and torrents on rules the operator
  # writes. Nothing here configures it; it is set up in its own UI.
  maintainerr:
    description: deletes what nobody watched, once your rules say so
    instances: false
    default: false
    # Everything it acts on, and every place a rule is written: Plex and
    # Tautulli for what was watched, Seerr for what was requested, both Arrs to
    # delete, qBittorrent to retire a torrent. Each setting is filled in its own
    # UI (v3.32's servarr, seerr, tautulli and download-client API modules),
    # except Plex: that one is the release's own server, so the wiring Job
    # connects it with the release Secret's plex-token (internal/apps/maintainerr).
    # One it cannot reach is a rule that silently never runs.
    calls: [plex, sonarr, radarr, seerr, tautulli, qbittorrent]
    # Everything it knows is in one SQLite database, at the root of the
    # directory DATA_DIR moves to /config (apps/server/src/app/config/
    # dataDir.ts and typeOrmConfig.ts at v3.32.0). The UI bundle it stages
    # there on every boot and its overlays are rebuilt, not state.
    snapshot: [maintainerr.sqlite, maintainerr.sqlite-wal, maintainerr.sqlite-shm]
    questions: []
