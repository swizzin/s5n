# The catalog: every app a seedbox can run, and the setup questions `box init` asks for
# it. The chart owns the file (values cannot add to or override it) and box reads it from
# the chart it installs, so a new app needs one entry here, one under `apps:` in
# values.yaml, its values.schema.json definition and, if it connects to others, a wiring
# step -- never a box release.
#
# Every app under `apps:` has exactly one entry here, and internal/catalog refuses a
# manifest that disagrees, or a question whose key is not a chart value or is a grant key:
# the grant (domain, paths, uid, app list) is box's own question.
#
# A question is `key` (the values path it writes), `prompt`, `help` (one optional line),
# `kind` (`string`, `secret`, `bool`, or `transient` -- a secret that outlives no file:
# asked after apply's confirm and never written anywhere, the Plex claim token being the
# case, since it expires minutes after issue), `default` (matching the kind) and `optional`
# (an empty answer is allowed).
#
# `exposure: host` serves the app at <app>.<domain> with its own listener and certificate,
# for a UI that writes absolute asset paths; the default, `path`, puts it under /<name> on
# the box's own name. `login: own` is an app that signs its users in itself, whose host
# then bypasses the box's login.
#
# `calls` is what the app dials inside the release, and the one list the NetworkPolicy is
# derived from: an app's ingress admits exactly the enabled apps naming it, so a call this
# list forgets is refused at the callee. "sonarr" means every instance of that Arr, and
# no app calls itself.
#
# `snapshot` is the globs an image upgrade can rewrite, so a failed update can put them
# back: path.Match syntax, relative to the app's config directory, and no `**`. Name the
# database a migration moves forward, the settings file a new version rewrites and the
# SQLite companions; never a cache, a log or Plex's metadata bundles.
#
# A new *kind* of question is the only catalog change that needs a box release
# (docs/box.md, "The catalog and box").
apps:
  qbittorrent:
    description: the download client; it seeds what the Arrs grab
    instances: false
    default: true
    # The download client is called, and calls nothing inside the release: its trackers and
    # RSS feeds are outside it.
    #
    # No questions: the WebUI skips its login for the release's addresses, so the account the
    # init container seals needs no answer -- but the key stays, with its "admin" default,
    # because the init container still writes a username and an existing seedbox may carry one.
    #
    # Its own settings upgrade renames and drops keys and records the version it reached
    # (src/app/upgrade.cpp at release-5.3.0: MIGRATION_VERSION and handleSettingKeys), so an
    # older qBittorrent cannot read a file a newer one has opened.
    snapshot: [qBittorrent/qBittorrent.conf]
    questions: []

  sonarr:
    description: TV, from the tracker to the library
    instances: true
    default: true
    # Its download clients, and Prowlarr: Prowlarr syncs each indexer into the Arr with its base
    # URL rewritten to <prowlarr>/<indexer id>/, so a search is an HTTP call from the Arr's pod
    # (Prowlarr v2.7, src/NzbDrone.Core/Applications/Sonarr/Sonarr.cs). qui is a download client
    # too, through its qBittorrent proxy (docs/features/reverse-proxy.md at v1.37.0). Plex and
    # Jellyfin are its Connect notifications, the library refresh after an import, which the
    # operator adds by hand.
    calls: [qbittorrent, sabnzbd, qui, prowlarr, plex, jellyfin]
    # An Arr's database and the config.xml that points at it, with the SQLite companions a
    # migration writes beside them (PathExtensions.cs at v5.0.0.2907: the DB constant,
    # GetDatabase and GetConfigPath). The log database and MediaCover are not state a migration
    # moves.
    snapshot: [sonarr.db, sonarr.db-wal, sonarr.db-shm, config.xml]
    # An Arr's second instance (an HD and a 4K Sonarr) is a grant decision, not a values
    # question: `box install sonarr --instance 4k` writes it.
    questions: []

  radarr:
    description: films, from the tracker to the library
    instances: true
    default: true
    # The same as Sonarr, for the same reasons
    # (src/NzbDrone.Core/Applications/Radarr/Radarr.cs).
    calls: [qbittorrent, sabnzbd, qui, prowlarr, plex, jellyfin]
    # The same as Sonarr (PathExtensions.cs at v7.0.0.10815: radarr.db, config.xml).
    snapshot: [radarr.db, radarr.db-wal, radarr.db-shm, config.xml]
    questions: []

  prowlarr:
    description: one indexer list, kept in sync with the Arrs
    instances: false
    default: true
    # It pushes indexers to the Arrs and tests each application it registers. The wiring gives
    # it no download client, but its search page grabs a release into one the operator adds.
    calls: [sonarr, radarr, lidarr, qbittorrent, sabnzbd]
    # The same again (PathExtensions.cs at v2.7.0.5723: prowlarr.db, config.xml).
    snapshot: [prowlarr.db, prowlarr.db-wal, prowlarr.db-shm, config.xml]
    questions: []

  plex:
    description: the media server your players talk to
    instances: false
    default: true
    # Plex calls nothing in the release: players are outside it, and the apps that dial it are
    # the ones naming it (Tautulli, Seerr, Maintainerr, Bazarr and the Arrs' Connect). Its web app writes absolute asset paths (/web/...),
    # so it is served at plex.<domain> rather than under /plex.
    exposure: host
    # Plex serves its own clients and issues its own token, so a login in front of it would be a
    # password no player asks for.
    login: own
    # The library database and the blobs beside it, and Preferences.xml, which a Plex upgrade
    # rewrites in a new shape. Its Metadata tree is covers and bundles Plex rebuilds, and
    # copying it would mean copying the whole library on every update. The image keeps Plex's
    # home under Library/Application Support (its PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR),
    # not at the top of /config.
    snapshot:
      - Library/Application Support/Plex Media Server/Preferences.xml
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db-wal
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.db-shm
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-wal
      - Library/Application Support/Plex Media Server/Plug-in Support/Databases/com.plexapp.plugins.library.blobs.db-shm
    questions:
      - key: secrets.plexClaimToken
        prompt: Plex claim token
        help: press enter to skip and claim the server yourself later; the token is at https://plex.tv/claim
        kind: transient
        optional: true

  tautulli:
    description: watch history and stats for Plex
    instances: false
    default: true
    # Its PMS link and its history both come from Plex's own API.
    calls: [plex]
    # `login: portal` is written out because the name is in box's frozen legacy set, where an
    # absent value means "own" for a chart that predates the key. Its own web login is switched
    # off by the init container (internal/ttlconf), and it is served under /tautulli rather
    # than at a name of its own.
    login: portal
    # Watch history and the config.ini that points at the database (plexpy/database.py at
    # v2.18.2: FILENAME = "tautulli.db"; plexpy/config.py: FILENAME = "config.ini").
    snapshot: [config.ini, tautulli.db, tautulli.db-wal, tautulli.db-shm]
    questions: []

  seerr:
    description: a request page for the people you share with
    # One Seerr per media server: it talks to exactly one, so a box with Plex and Jellyfin
    # runs `seerr` and `seerr-jellyfin`, each at a name of its own.
    instances: true
    default: true
    # Plex for the library and for signing people in, and both Arrs to add what was requested:
    # an unlisted caller never reaches the Arrs' ingress, however open the egress is. Jellyfin
    # is the other media server it can be set up with -- Seerr talks to one, so a box without
    # Plex runs it against Jellyfin -- and Tautulli feeds its watch history
    # (server/api/jellyfin.ts and tautulli.ts at v3.5.2).
    calls: [plex, jellyfin, tautulli, sonarr, radarr]
    # As Plex: Seerr's bundle loads its assets from the site root, so the path route broke the
    # page and it is served at seerr.<domain>.
    exposure: host
    # It signs people in with the box's media server -- Plex's own account, or the Jellyfin
    # account the wiring Job makes its owner -- so a login here would be a second password.
    login: own
    # Its settings and its database, in a subdirectory of the config directory
    # (server/lib/settings/index.ts and server/datasource.ts at v3.5.1: settings.json,
    # db/db.sqlite3).
    snapshot: [settings.json, db/db.sqlite3, db/db.sqlite3-wal, db/db.sqlite3-shm]
    questions: []

  # Opt-in: a second media server, served at jellyfin.<domain> because its players are
  # configured with a server address, and signing its players in itself. It transcodes in
  # software until a GPU is a platform feature.
  jellyfin:
    description: a media server your players talk to, with its own accounts
    instances: false
    default: false
    # It calls nothing in the release: its players are outside it. Seerr, Maintainerr, Bazarr
    # and the Arrs' Connect dial it, each set up by hand. Its web client writes absolute asset
    # paths, so it is served at jellyfin.<domain> rather than under /jellyfin.
    exposure: host
    # Every Jellyfin client authenticates against the server with its own token, so a login
    # page in front of it is a form no player can answer; its host bypasses the edge login as
    # Plex's does, and the NetworkPolicy keeps the cluster out. The first-run window that comes
    # with that is closed inside the pod (templates/workloads.yaml).
    login: own
    # The four configuration files a version rewrites, and the library database with its SQLite
    # companions. data/metadata and data/trickplay are artwork the server rebuilds, and
    # data/library is its own view of the media. Its settings live under
    # JELLYFIN_CONFIG_DIR=/config/config and its trees under JELLYFIN_DATA_DIR=/config, both
    # the image's own environment.
    #
    # An account, an API key and a library's paths are rows in jellyfin.db, which is why a
    # migrate rewriter has to edit the database.
    snapshot:
      - config/*.xml
      - data/jellyfin.db
      - data/jellyfin.db-wal
      - data/jellyfin.db-shm
    questions: []

  # Opt-in: a second UI for the same qBittorrent, not something a box should have because it
  # installed the defaults.
  qui:
    description: cross-seed and automation for qBittorrent, in one page
    instances: false
    default: false
    # qui speaks OIDC, so it signs in through the login's own provider rather than behind a
    # login it cannot see. The chart gives it the issuer and the secret; this flag is what makes
    # box register the client, so a second OIDC app is one entry here and the chart's `oidc:`
    # block beside it, never a box release.
    oidc: true
    # One qBittorrent, its own instance row, and the Arrs: qui's Arr integration resolves a
    # title to the ID it searches for, from qui's own pod. Prowlarr is where its cross-seed
    # search imports indexers from (docs/features/search.md at v1.37.0). A missing edge here is
    # a connection the callee refuses with nothing in the app to say so.
    calls: [qbittorrent, sonarr, radarr, prowlarr]
    # Its database and config.toml, which is where its session secret lives: the credentials it
    # stores in the database are encrypted with that value, so the pair goes back together
    # (internal/config/config.go at v1.35.0: resolveConfigPath and the qui.db path).
    snapshot: [config.toml, qui.db, qui.db-wal, qui.db-shm]
    questions: []

  # Opt-in: it watches IRC announces and feeds and hands what it finds to the download
  # client, and it is idle until the operator configures indexers by hand.
  autobrr:
    description: grabs a release when it is announced, before the feed catches up
    instances: false
    default: false
    # autobrr speaks OIDC too, and only OIDC: at v1.90.0 it has no way to run without a login of
    # its own, so behind the edge alone it would ask for two passwords. The flag is the whole
    # change: the chart wires the issuer, the secret and the trust anchor from it, and box
    # registers the client.
    oidc: true
    # Its download clients, and every Arr its actions push to, made from autobrr's pod. qui too:
    # its qBittorrent proxy is a download client autobrr can be pointed at. SABnzbd is an action
    # type, and Prowlarr's Torznab and Newznab endpoints are feeds (internal/domain/action.go and
    # feed.go at v1.91.1). A missing edge is a policy that drops the connection without a word.
    calls: [qbittorrent, qui, sabnzbd, sonarr, radarr, lidarr, prowlarr]
    # Its SQLite database and config.toml (internal/database/database.go at v1.90.0:
    # dataSourceName(cfg.ConfigPath, "autobrr.db"); internal/config/config.go: config.toml).
    snapshot: [config.toml, autobrr.db, autobrr.db-wal, autobrr.db-shm]
    questions: []

  # Opt-in: an anti-leech firewall for the download client. It reads qBittorrent's peer list
  # and tells it to drop the peers its rules reject, so it acts the moment it is connected.
  pbh:
    description: drops the peers that cheat, leech or misbehave
    instances: false
    default: false
    # Its whole job: read the downloader's peers and drop what its rules ban. Its GeoIP
    # database and rule subscriptions come from the public internet, which needs no entry here.
    calls: [qbittorrent]
    # Its WebUI fetches /api/... from the site root and builds asset URLs relative to it, so it
    # needs a host name of its own: pbh.<domain>.
    exposure: host
    # config.yml, which PBH's own migrations rewrite in place, and the database in its persist
    # directory (DatabaseDriverConfig.java and SQLiteDatabaseDriver.java at v9.5.4). The GeoIP
    # database and subscriptions are downloads, and the ban history is a log.
    snapshot: [config.yml, persist/peerbanhelper-nt.db, persist/peerbanhelper-nt.db-wal, persist/peerbanhelper-nt.db-shm]
    questions: []

  # Opt-in: music, and an Arr like the other two, but a box that installs the defaults has no
  # music library and its root folder needs profiles the operator tunes.
  lidarr:
    description: music, from the tracker to the library
    instances: true
    default: false
    # The same as Sonarr and Radarr: its download clients, Prowlarr, which syncs each indexer
    # over Lidarr's /api/v1 (prowlarr@v3.1.0.5799:
    # src/NzbDrone.Core/Applications/Lidarr/Lidarr.cs, LidarrSettings.cs and ILidarrV1Proxy),
    # and the media servers its Connect refreshes.
    calls: [qbittorrent, sabnzbd, qui, prowlarr, plex, jellyfin]
    # Its database, the config.xml that points at it, and the SQLite companions
    # (PathExtensions.cs at v3.1.2.4902: APP_CONFIG_FILE and DB).
    snapshot: [lidarr.db, lidarr.db-wal, lidarr.db-shm, config.xml]
    questions: []

  # Opt-in: subtitles for the libraries the Arrs already have. Upstream Bazarr reads one
  # Sonarr and one Radarr per instance, so it is one pod per Arr pair and a box with a 4K pair
  # runs bazarr-4k beside bazarr.
  bazarr:
    description: subtitles for the TV and films the Arrs already have
    instances: true
    default: false
    # The two it reads, and the media servers it refreshes after a subtitle download
    # (bazarr/app/config.py at v1.6.2: the plex and jellyfin sections). Nothing inside the
    # release calls it: the Arrs do not know it exists.
    calls: [sonarr, radarr, plex, jellyfin]
    # Its settings file and its SQLite database, with the WAL companions a running instance
    # writes (bazarr/app/config.py:519 at v1.6.2: config/config.yaml relative to the config
    # directory; bazarr/app/database.py:82-97: db/bazarr.db, journal_mode=WAL).
    snapshot: [config/config.yaml, db/bazarr.db, db/bazarr.db-wal, db/bazarr.db-shm]
    questions: []

  # Opt-in: usenet, the second download client rather than a companion, so a box that
  # installed the defaults has one already. Its own login is off with no username and
  # password (sabnzbd/interface.py:358-361 at 5.1.3), which is the state the chart leaves it
  # in: the edge is the only login.
  #
  # It calls nothing inside the release: its news servers and indexers are outside it. The
  # Arrs call it, which is the `calls: [sabnzbd]` they carry.
  sabnzbd:
    description: the usenet download client; it fetches what the Arrs grab
    instances: false
    default: false
    # Everything SABnzbd knows -- servers, categories, folders, switches -- is this one INI
    # file, which its own config writer rewrites as versions add keys. The history database and
    # the queue are not state a new image rewrites.
    snapshot: [sabnzbd.ini]
    questions: []

  # Opt-in: a file manager over the same downloads and library, which a box does not need to
  # be useful, and the whole data tree in a browser.
  #
  # It signs in through the login's own provider, like qui and autobrr: at v2.1.0-stable its
  # only way to grant its admin is a group claim, and its own password method would be a form
  # nobody's account can answer. `login: portal` is unchanged: the edge's login is still in
  # front, and the app's round trip reaches the same person, so a visit looks like one login.
  filebrowser:
    description: a file manager for the downloads and the library, in a browser
    instances: false
    default: false
    oidc: true
    login: portal
    # Its database and its SQLite companions: the app opens it in WAL mode whatever
    # FILEBROWSER_SQL_WAL says -- that switch is the file index, which lives in the cache --
    # because the user store's DSN carries _journal_mode=WAL at v2.1.0-stable
    # (internal/database/sqldb/sqldb.go).
    snapshot: [database.sqlite, database.sqlite-wal, database.sqlite-shm]
    questions: []

  # Opt-in, and louder so: it deletes media and torrents on rules the operator writes.
  # Nothing here configures it; it is set up in its own UI.
  maintainerr:
    description: deletes what nobody watched, once your rules say so
    instances: false
    default: false
    # Everything it acts on and every place a rule is written: Plex or Jellyfin, and Tautulli,
    # for what was watched, Seerr for what was requested, both Arrs to delete, qBittorrent to
    # retire a torrent (Jellyfin: apps/server/src/modules/api/media-server at v3.33.0). Each is filled in its own UI (v3.32's servarr, seerr, tautulli and
    # download-client API modules) except Plex, which the wiring Job connects with the release
    # Secret's plex-token (internal/apps/maintainerr). One it cannot reach is a rule that
    # silently never runs.
    calls: [plex, jellyfin, sonarr, radarr, seerr, tautulli, qbittorrent]
    # Everything it knows is in one SQLite database at the root of the directory DATA_DIR moves
    # to /config (apps/server/src/app/config/dataDir.ts and typeOrmConfig.ts at v3.32.0). The UI
    # bundle it stages there on every boot and its overlays are rebuilt, not state.
    snapshot: [maintainerr.sqlite, maintainerr.sqlite-wal, maintainerr.sqlite-shm]
    questions: []
