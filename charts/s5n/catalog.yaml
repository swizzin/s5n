# The catalog: every app a seedbox can run, and the setup questions `box init`
# asks for it.
#
# The chart owns this file, the same way it owns variants.yaml: it ships inside
# the chart archive and `--set` or a values file cannot add to it, change it or
# override it. box reads it from the chart release it is installing, so adding
# an app does not need a box release -- one entry here, one entry under `apps:`
# in values.yaml, its values.schema.json definition, and, if the app needs
# connecting to the others, a wiring step in the s5n image.
#
# Every app under `apps:` in values.yaml has exactly one entry below and vice
# versa. internal/catalog refuses a manifest that disagrees, and refuses a
# question whose key is not a chart value or is a grant key: the grant (domain,
# paths, uid, the app list) is box's own question, never a manifest's. So a
# question may only name a key the *user* owns.
#
# A question is:
#   key       the chart values path the answer is written to
#   prompt    the line `box init` shows
#   help      one optional line under the prompt (why, or where to get it)
#   kind      one of:
#               string     free text
#               secret     masked input; written to the values file, never echoed
#                          and never printed in an apply diff
#               bool       yes or no
#               transient  a secret that outlives no file: asked last, after
#                          apply's confirm, handed to that one apply and never
#                          written to values or the grant. The Plex claim token
#                          is the case: it expires about four minutes after
#                          https://plex.tv/claim issues it, so it can only be
#                          supplied at install time. A transient key still has
#                          to exist in values.schema.json, because it is passed
#                          to the chart.
#   default   a starting answer; must match the kind
#   optional  an empty answer is allowed (the app copes without it)
#
# An entry also says how the chart serves the app:
#
#   exposure: path   under /<name> on the box's own host name (the default)
#   exposure: host   at <app>.<domain>, with its own listener and certificate,
#                    for a UI that writes absolute asset paths and so cannot
#                    live under a prefix. The chart owns this decision; it is
#                    not a values key, because a user choosing it wrongly is a
#                    broken UI, not tuning. `box init` resolves each such name
#                    and checks it answers where the domain does before it
#                    writes anything for it (docs/box.md, "Certificates").
#
# A new *kind* of question is the only catalog change that needs a box release
# (docs/box.md, "The catalog and box").
apps:
  qbittorrent:
    description: the download client; it seeds what the Arrs grab
    instances: false
    default: true
    questions:
      - key: apps.qbittorrent.webuiUsername
        prompt: qBittorrent's web login name
        help: the password is generated for you and kept in the box's Secret
        kind: string
        default: admin

  sonarr:
    description: TV, from the tracker to the library
    instances: true
    default: true
    # An Arr's second instance (an HD and a 4K Sonarr) is a grant decision, not
    # a values question: `box install sonarr --instance 4k` writes it.
    questions: []

  radarr:
    description: films, from the tracker to the library
    instances: true
    default: true
    questions: []

  prowlarr:
    description: one indexer list, kept in sync with the Arrs
    instances: false
    default: true
    questions: []

  plex:
    description: the media server your players talk to
    instances: false
    default: true
    # Plex's web app writes absolute asset paths (/web/...), so it is served at
    # plex.<domain> rather than under /plex.
    exposure: host
    questions:
      - key: secrets.plexClaimToken
        prompt: Plex claim token
        help: press enter to skip and claim the server yourself later; the token is at https://plex.tv/claim
        kind: transient
        optional: true

  tautulli:
    description: watch history and stats for Plex
    instances: false
    default: true
    questions: []

  seerr:
    description: a request page for the people you share with
    instances: false
    default: true
    # Same as Plex: Seerr's bundle loads its assets from the site root, so the
    # path route broke the page and it is served at seerr.<domain>.
    exposure: host
    questions: []

  # Opt-in: a second UI for the same qBittorrent, not something a box should
  # have because it installed the defaults.
  qui:
    description: cross-seed and automation for qBittorrent, in one page
    instances: false
    default: false
    # qui speaks OIDC, so it signs in through the login's own provider rather
    # than sitting behind a login it cannot see. The chart is what gives it the
    # issuer and the client secret; this flag is what makes box register the
    # client, so a second app that speaks OIDC is one entry here (and the
    # chart's `oidc:` block beside it) rather than a box release.
    oidc: true
    questions: []

  # Opt-in: it watches IRC announces and feeds and hands what it finds to the
  # download client, and it is idle until the operator configures indexers by
  # hand -- not something a box should have because it installed the defaults.
  autobrr:
    description: grabs a release when it is announced, before the feed catches up
    instances: false
    default: false
    # autobrr speaks OIDC too, and only OIDC: at v1.90.0 it has no way to run
    # without a login of its own (no authDisabled, no trusted-header mode), so a
    # box that served it behind the edge alone would ask for two passwords. The
    # flag is the whole change: the chart wires the issuer, the secret and the
    # trust anchor from it, and box registers the client.
    oidc: true
    questions: []

  # Opt-in, and louder so: it deletes media and torrents on rules the operator
  # writes. Nothing here configures it; it is set up in its own UI.
  maintainerr:
    description: deletes what nobody watched, once your rules say so
    instances: false
    default: false
    questions: []
