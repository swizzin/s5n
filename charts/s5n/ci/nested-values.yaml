# Existing category names are kept, never renamed: migrate adopts what the source used.
# Mixed case and one subcategory level are legal, and the parent directory (4K) is
# created with the leaf.
auth:
  edge: true

storage:
  data:
    existingClaim: box-nested-data
  config:
    existingClaim: box-nested-config

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080
  sonarr:
    instances:
      - { suffix: "", category: TV, enabled: true }
      - { suffix: 4k, category: "4K/TV", enabled: true }
  radarr:
    instances:
      - { suffix: "", category: Movies, enabled: true }
      - { suffix: 4k, category: "4K/Movies", enabled: true }

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
