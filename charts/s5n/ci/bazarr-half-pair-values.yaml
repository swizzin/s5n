# One Bazarr per Arr pair, with a pair that has one side: bazarr-4k reads the 4K Radarr
# and the Job switches the Sonarr side off. An absent side has to be absent from the
# Job's config, not an empty object the Job reads as wired.
auth:
  edge: true

storage:
  data:
    existingClaim: box-bazarr-data
  config:
    existingClaim: box-bazarr-config

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080
  radarr:
    instances:
      - { suffix: "", category: movies, enabled: true }
      - { suffix: 4k, category: movies-4k, enabled: true }
  bazarr:
    enabled: true
    instances:
      - { suffix: "", enabled: true }
      - { suffix: 4k, enabled: true }

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
