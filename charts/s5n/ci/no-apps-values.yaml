# A box with no apps: what `box init` writes when the picker leaves nothing ticked, and
# what `box migrate apply` adopts into before switching the plan's apps on. The wiring
# Job still runs as a hook, finds nothing, publishes an ok receipt and writes nothing.
auth:
  edge: true

storage:
  data:
    existingClaim: box-no-apps-data
  config:
    existingClaim: box-no-apps-config

apps:
  qbittorrent:
    enabled: false
  sonarr:
    enabled: false
  radarr:
    enabled: false
  prowlarr:
    enabled: false
  plex:
    enabled: false
  tautulli:
    enabled: false
  seerr:
    enabled: false
  qui:
    enabled: false
  autobrr:
    enabled: false
  pbh:
    enabled: false
  maintainerr:
    enabled: false

# It is still the one thing a release serves: the login and the Gateway answer
# there whether any app is on or not.
gateway:
  host: box.example.com
