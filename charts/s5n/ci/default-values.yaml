# The chart's defaults plus the one statement a plain install must make: the chart ships
# no login, so the operator says one is in front of the release. The two claims it
# expects (`s5n-data`, `s5n-config`) are still the defaults, and the chart creates
# neither.
auth:
  edge: true

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
