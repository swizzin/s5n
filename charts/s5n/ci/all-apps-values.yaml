# Every catalog app enabled at once, with both Arr pairs: the one render that carries
# every NetworkPolicy edge at once, so a missing one is visible here.
auth:
  edge: true
  # box writes this from the grant for an OIDC app; a plain helm install sets it to the
  # proxy Service's ClusterIP.
  oidc:
    gatewayIP: 10.96.31.116

# The account root's login admits, written by box from the grant: Jellyfin's first
# user is named after it.
login: example

storage:
  data:
    existingClaim: box-all-data
  config:
    existingClaim: box-all-config

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080
  sonarr:
    instances:
      - { suffix: "", category: tv, enabled: true }
      - { suffix: 4k, category: tv-4k, enabled: true }
  radarr:
    instances:
      - { suffix: "", category: movies, enabled: true }
      - { suffix: 4k, category: movies-4k, enabled: true }
  lidarr:
    enabled: true
  bazarr:
    enabled: true
    instances:
      - { suffix: "", enabled: true }
      - { suffix: 4k, enabled: true }
  qui:
    enabled: true
  autobrr:
    enabled: true
  maintainerr:
    enabled: true
  pbh:
    enabled: true
  sabnzbd:
    enabled: true
  filebrowser:
    enabled: true
  # The second media server: its own host name and accounts, and the /cache emptyDir
  # its transcodes need on a read-only root filesystem.
  jellyfin:
    enabled: true
    knownProxies:
      - 10.244.0.0/16

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
