# A rehearsal box: the lock `box migrate apply` sets on a box built from a rehearsal
# snapshot (box writes it in the grant). The one difference from a plain render is the
# release's egress policy: no public-internet ipBlocks, and the policies on even with
# networkPolicy.enabled false.
auth:
  edge: true

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080

rehearsal: true
# The address each app pod's gate waits on until the lock closes it: box writes
# the cluster DNS Service's metrics port here with the flag.
rehearsalGate: 10.96.0.10:9153

# The lock forces the policies on, so this file proves it: a grant that switched
# default-deny off still cannot leave a rehearsal box open.
networkPolicy:
  enabled: false

gateway:
  host: box.example.com
