# The catalog's opt-in apps, all enabled: they default off, so this is the only render
# that carries them -- Maintainerr's no-timeout rule and PeerBanHelper's host route and
# init container included, which kubeconform would otherwise never see.
auth:
  edge: true
  # box writes this from the grant for an OIDC app; a plain helm install sets it to the
  # proxy Service's ClusterIP.
  oidc:
    gatewayIP: 10.96.31.116

# The account root's login admits, written by box from the grant: Jellyfin's first
# user is named after it.
login: example

# The person's Jellyfin password. box init makes one and shows it once; a plain
# helm install names its own, which is the only way the account is usable.
storage:
  data:
    existingClaim: box-catalog-data
  config:
    existingClaim: box-catalog-config

apps:
  qbittorrent:
    torrent:
      # No chart default: a helm install chooses its peer port, in the band Kubernetes does
      # not assign by itself.
      port: 30080
  lidarr:
    enabled: true
  bazarr:
    enabled: true
  qui:
    enabled: true
  autobrr:
    enabled: true
  maintainerr:
    enabled: true
  pbh:
    enabled: true
  sabnzbd:
    enabled: true
  filebrowser:
    enabled: true
  # The second media server: its own host name and accounts, and the /cache emptyDir
  # its transcodes need on a read-only root filesystem.
  jellyfin:
    enabled: true
    knownProxies:
      - 10.244.0.0/16

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
