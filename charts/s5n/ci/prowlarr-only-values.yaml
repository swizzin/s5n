# A release with no wired app: one app the wiring Job talks to, and no Arr and no
# qBittorrent. The Job's config then carries no instance and no qBittorrent block, which
# it has to accept: it is the release's Helm hook, so a refusal is an install nobody can
# finish.
auth:
  edge: true

storage:
  data:
    existingClaim: box-prowlarr-only-data
  config:
    existingClaim: box-prowlarr-only-config

apps:
  qbittorrent:
    enabled: false
  sonarr:
    enabled: false
  radarr:
    enabled: false
  plex:
    enabled: false
  tautulli:
    enabled: false
  seerr:
    enabled: false

# Plex and Seerr are served at plex.<domain> and seerr.<domain>, so a render needs
# the domain.
gateway:
  host: box.example.com
