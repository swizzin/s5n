# Blessed image variants. The chart owns this file and ships it inside the chart
# archive: it is not a values file, so neither `--set` nor a user's values can add a
# repository. The images a release can ever run are the ones this chart shipped with.
#
# apps.<app>.image.variant names one entry, and a value may pin a tag or a digest inside
# that variant's repository, nothing else. A non-default variant is an alternate build the
# e2e has to test like the default before it ships, with one named exemption and no
# general escape hatch.
#
# The admission policy's blessed-repository list is generated from this file
# (install/platform/admission/), so "blessed by the chart" and "admitted by the cluster"
# are one list.
qbittorrent:
  default:
    # The project's own build on libtorrent 2.1, which is the line a box runs unless it has
    # a reason to run another: the same image as lt2.1, whose block says what 2.1 is.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt2.1"
    digest: sha256:81b22a6824d49944b716ef7b201220f10c9a624339c953e4a87f89c4ca67bdb9
  home-operations:
    # The image the default variant named until the project built its own, kept as a real
    # entry so a box already running it keeps that builder: an unknown variant fails the
    # render, which stops a seedbox's apply. Nothing chooses it anew.
    repository: ghcr.io/home-operations/qbittorrent
    tag: "5.3.1"
    digest: sha256:fcdbc4ac4a66d8c205ac67e4fe1b578158aaee0a50369c3d04918977f4f359c4
  lt1.2:
    # The project's own static build: qBittorrent on libtorrent 1.2, musl, for baseline
    # x86-64-v2 and armv8-a. Its layout is the default's (HOME and XDG under /config, the conf
    # at /config/qBittorrent/qBittorrent.conf, ports from QBT_*), so the chart's one pod spec
    # runs it unchanged and a box can switch variants in place. It ships no curl. The name is
    # the libtorrent line and the build profile, never a version: the tag adds only
    # qBittorrent's, and libtorrent's release is pinned by the digest alone.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt1.2"
    digest: sha256:c313f26c4bfef1c2bd8d8e9ce4a16b75f457392bfed05a4ecbef4c39593af698
  lt1.2-10g:
    # lt1.2 with two larger compiled-in network buffers for 10 Gbit links --
    # max_peer_recv_buffer_size 4 MiB and send_not_sent_low_watermark 1 MiB -- and nothing
    # else. "Base" is this build's five tuned defaults, never libtorrent's stock ones. Both
    # architectures, lt1.2's layout, and every 10G build links mimalloc where the base builds
    # keep musl's allocator.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt1.2-10g"
    digest: sha256:c1ee490bf240c1de3521a3496f700245c7c6b8d0d8abe76d81bd4cebd73fd714
  lt2.1:
    # The same build on libtorrent 2.1. 2.0 copied files through mmap; 2.1 reads and writes
    # with pread/pwrite and a cache of its own (src/session.cpp:492, src/pread_disk_io.cpp:329
    # at v2.1.3), sized from qBittorrent's Session\DiskQueueSize.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt2.1"
    digest: sha256:81b22a6824d49944b716ef7b201220f10c9a624339c953e4a87f89c4ca67bdb9
  lt2.1-10g:
    # lt2.1 with the same two buffers, and nothing else: the libtorrent line and the link
    # profile are independent axes. The chart seeds a 512 MiB Session\DiskQueueSize on it
    # (internal/qbtconf), the size a 10 Gbit link was measured with.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt2.1-10g"
    digest: sha256:396502c5238633c853dcbcc38a1a1eaa15f9874bbce9584140a06f099bf0c521
  lt1.2-10g-znver3:
    # The one build profile the e2e does not run: compiled for AMD Zen 3 (-march=znver3), so it
    # dies with SIGILL on CI's runners and most hosts, and amd64 only. What tests it instead is
    # the swizzin/qbittorrent repository's own verify and smoke test on a Zen 3 runner before
    # the tag is pushed; its layout is lt1.2's, which the e2e does run. Both Zen 3 entries here
    # are the exemption.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt1.2-10g-znver3"
    digest: sha256:42a2cf01cc926061a895141c1272c3e2e3ea966e9cea4b833051052fe522006f
  lt2.1-10g-znver3:
    # The same Zen 3 exemption on libtorrent 2.1: see lt1.2-10g-znver3, the build profile it
    # shares, and lt2.1-10g, the disk queue it shares.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt2.1-10g-znver3"
    digest: sha256:15fa1d5166ea00bd754396f02489ec99a9c823f98c9097f0932cf42d03e47555
  lt1.2-10g-znver3-mimalloc:
    # The former name of lt1.2-10g-znver3, kept as a real entry so a values file that still
    # names it keeps rendering and updating: an unknown variant fails the render
    # (templates/_helpers.tpl), which would stop a seedbox's apply dead. It pins the same
    # image, tag and digest alike, and nothing chooses it anew.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.1-lt1.2-10g-znver3"
    digest: sha256:42a2cf01cc926061a895141c1272c3e2e3ea966e9cea4b833051052fe522006f

