# Blessed image variants. The chart owns this file and ships it inside the
# chart archive; it is NOT a values file, so neither `--set`, a user's
# values.yaml nor a box values file can add a repository to it. The set of
# images a release can ever run is the set this chart shipped with.
#
# apps.<app>.image.variant names one of the variants below. Values may pin a tag
# or a digest inside that variant's repository, nothing else — the repository
# comes from here. A variant other than `default` is an alternate build of the
# same app that the e2e has to test like the default before it ships.
#
# The admission policy's blessed-repository list is generated from this file
# too (install/platform/admission/), so "blessed by the chart" and "admitted by
# the cluster" are the same list, not two lists that drift.
qbittorrent:
  default:
    repository: ghcr.io/home-operations/qbittorrent
    tag: "5.3.0"
    digest: sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8

