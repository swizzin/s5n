# Blessed image variants. The chart owns this file and ships it inside the
# chart archive; it is NOT a values file, so neither `--set`, a user's
# values.yaml nor a box values file can add a repository to it. The set of
# images a release can ever run is the set this chart shipped with.
#
# apps.<app>.image.variant names one of the variants below. Values may pin a tag
# or a digest inside that variant's repository, nothing else — the repository
# comes from here. A variant other than `default` is an alternate build of the
# same app that the e2e has to test like the default before it ships. There is
# one exemption and it is named in its own block; there is no general escape
# hatch.
#
# The admission policy's blessed-repository list is generated from this file
# too (install/platform/admission/), so "blessed by the chart" and "admitted by
# the cluster" are the same list, not two lists that drift.
qbittorrent:
  default:
    repository: ghcr.io/home-operations/qbittorrent
    tag: "5.3.0"
    digest: sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
  lt1.2:
    # The project's own static build: qBittorrent on libtorrent 1.2, musl, for
    # baseline x86-64-v2 and armv8-a. Its layout is the default's (HOME and XDG
    # under /config, the conf at /config/qBittorrent/qBittorrent.conf, ports from
    # QBT_WEBUI_PORT and QBT_TORRENTING_PORT), so the chart's one pod spec runs
    # it unchanged, and a box can switch variants in place. It ships no curl.
    # The name is the libtorrent line and the build profile, never a version. The
    # tag adds only qBittorrent's version (5.3.0-lt1.2); libtorrent's release is
    # pinned by the digest alone, so a later 1.2.21 is a new digest on this same
    # tag and stays this variant.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.0-lt1.2"
    digest: sha256:bbfd435b60bd58a79d2f660a60f540e0418ca3d45a490624d3e0ddae62ad7d08
  lt1.2-10g:
    # lt1.2 with two larger compiled-in network buffers for 10 Gbit links:
    # libtorrent's max_peer_recv_buffer_size 4 MiB (base 2 MiB) and
    # send_not_sent_low_watermark 1 MiB (base 512 KiB), and nothing else. The base
    # builds carry five tuned defaults of their own, so "base" here is that build,
    # never libtorrent's stock ones. Both architectures. lt1.2's layout.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.0-lt1.2-10g"
    digest: sha256:08cd01bdb27c51ff2357dde1c3a6e09df06d98080fb7b5c085966c14810f8420
  lt2.1:
    # The same build on libtorrent 2.1. 2.x keeps no disk cache of its own and
    # maps files instead, and the chart sets no cache options, so the same pod
    # spec runs it unchanged. lt1.2's layout.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.0-lt2.1"
    digest: sha256:cbbea04f17ea9bba10e09bbeb0fb2b6045d82842572c29f26999a81bd1988d3a
  lt2.1-10g:
    # lt2.1 with the same two larger buffers for 10 Gbit links, and nothing else:
    # the libtorrent line and the link profile are independent axes. lt1.2's
    # layout.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.0-lt2.1-10g"
    digest: sha256:d929445b47adb6ff5255350fb56ed3282e7737c81492679fb21cc38ae1bd86fc
  lt1.2-10g-znver3-mimalloc:
    # The one variant the e2e does not run: it is compiled for AMD Zen 3
    # (-march=znver3), so on CI's runners and most hosts it dies with SIGILL at
    # start, and it is amd64 only, so an arm64 node cannot pull it. What tests it
    # instead: the swizzin/qbittorrent repository's own binary verify and smoke
    # test, run on a Zen 3 runner before the tag is pushed. Its layout is lt1.2's,
    # which the e2e does run.
    repository: ghcr.io/swizzin/qbittorrent
    tag: "5.3.0-lt1.2-10g-znver3-mimalloc"
    digest: sha256:c6959055763eec4b2689ae0a11762b6da2cedb4a936985e6b1413b6cba188b46

