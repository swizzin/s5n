    digest: sha256:d7ea1a79cf8cc2603890287d7c0e5bc277e4909c1df93f48f000833d2771eca0

seerr:
  default:
    # Upstream digest pin, not ghcr.io/home-operations: that catalog has no Seerr
    # image. Its Dockerfile ends USER node:node (uid 1000) and exposes 5055.
    repository: ghcr.io/seerr-team/seerr
    tag: "v3.5.1"
    digest: sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be

qui:
  default:
    # Upstream digest pin, not ghcr.io/home-operations: no qui image there. The
    # image is root by default with an entrypoint that execs the binary as
    # whichever uid runs it; it keeps its whole state under /config.
    repository: ghcr.io/autobrr/qui
    tag: "v1.35.0"
    digest: sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2

autobrr:
  default:
    # Upstream digest pin, not ghcr.io/home-operations: no autobrr image there.
    # The image declares no USER, so it would run as root without the pod's
    # security context; it keeps its whole state (config.toml, the SQLite
    # database and its WAL) under /config.
    repository: ghcr.io/autobrr/autobrr
    tag: "v1.90.0"
    digest: sha256:72bb5fe5e8c73f85660f92502d9015b21b07156495f039b55864633b9f8b7a89

maintainerr:
  default:
    # Upstream digest pin, not ghcr.io/home-operations: no Maintainerr image
    # there. Its Dockerfile ends USER node (uid 1000) and its tags carry no "v".
    repository: ghcr.io/maintainerr/maintainerr
    tag: "3.32.0"
    digest: sha256:5dcd5bef9d49c614bb74453df3da198afc05a38d8e2cd96b3669bc2c76a94112

pbh:
  default:
    # Upstream digest pin, not ghcr.io/home-operations: no PeerBanHelper image
    # there. Its Dockerfile ends USER 0 and keeps its state under /app/data, so
    # the chart runs it as the seedbox uid and moves the data root to /config
    # through -Dpbh.datadir; its tags carry the "v".
    repository: docker.io/ghostchu/peerbanhelper
    tag: "v9.5.4"
    digest: sha256:01a8ccab4d007701ecaf9c433e934a323bddd8a1668d3484543be870de8762bf

