# A slice of charts/s5n/catalog.yaml, the same way values.yaml is a slice of the
# chart's: the three apps the fixture chart carries, and one of them served at a
# host of its own, so apply's per-host step has a name to find.
apps:
  qbittorrent:
    description: the download client
  sonarr:
    description: the television library
    # An app that signs in through the login's OIDC provider: apply has to
    # register its client, in a Secret that lives in the seedbox's namespace.
    oidc: true
  radarr:
    description: the film library, served at a name of its own
    exposure: host
    # It signs its own users in, so its host bypasses the login: the rule
    # write carries this list from the catalog, not from a name in box.
    login: own
