# A slice of charts/s5n/values.yaml, kept small: exactly the keys the fixture
# grant and values file touch, plus one app neither of them mentions (radarr),
# which is what proves the effective values switch off what the grant never
# enabled.
global:
  puid: 1000
  pgid: 1000
  tz: Etc/UTC

storage:
  data:
    existingClaim: ""
    hostPath: /srv/s5n/data
    size: 1Ti
  config:
    existingClaim: ""
    hostPath: /srv/s5n/config
    size: 20Gi

gateway:
  enabled: true
  host: ""
  parentRef:
    name: s5n
    namespace: s5n-gateway
    sectionName: ""

networkPolicy:
  enabled: true

wiring:
  timeoutSeconds: 300

apps:
  qbittorrent:
    enabled: true
    port: 8080
  sonarr:
    enabled: true
    port: 8989
  radarr:
    enabled: true
    port: 7878
