# A grant: root's decisions for one seedbox. Every key here is one
# internal/seedbox/grant.go says the grant owns.
namespace: testbox

# The account root's login admits. It is the grant's own record, and an app host
# cannot be served without the access_control rule that names it.
login: alice

global:
  puid: 1000
  pgid: 1000

storage:
  data:
    path: /srv/s5n/data
  config:
    path: /srv/s5n/config

gateway:
  host: box.example.com
  parentRef:
    name: s5n
    namespace: s5n-gateway

networkPolicy:
  enabled: true

apps:
  qbittorrent:
    enabled: true
  sonarr:
    enabled: true
