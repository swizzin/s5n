# The same grant with radarr enabled too, for the tests whose step moves two
# apps and copies only one.
namespace: testbox

login: alice

global:
  puid: 1000
  pgid: 1000

storage:
  data:
    path: /srv/s5n/data
  config:
    path: /srv/s5n/config

gateway:
  host: box.example.com
  parentRef:
    name: s5n
    namespace: s5n-gateway

networkPolicy:
  enabled: true

apps:
  qbittorrent:
    enabled: true
  sonarr:
    enabled: true
  radarr:
    enabled: true
