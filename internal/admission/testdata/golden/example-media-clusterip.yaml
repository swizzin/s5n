apiVersion: v1
kind: ConfigMap
metadata:
  name: s5n-grant-example-media
  namespace: s5n-system
  labels:
    app.kubernetes.io/part-of: s5n
    s5n.io/grant: example-media
data:
  # Generated from internal/admission/testdata/charts/clusterip/variants.yaml; edit the chart, not this.
  blessedRepositories: "registry.example.com/seedbox/plex"
  serviceType: ClusterIP
  torrentNodePort: "31999"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s5n-grant-example-media
  labels:
    app.kubernetes.io/part-of: s5n
spec:
  policyName: s5n-blessed-images
  validationActions: ["Deny"]
  paramRef:
    name: s5n-grant-example-media
    namespace: s5n-system
    parameterNotFoundAction: Deny
  matchResources:
    # The binding is cluster-scoped, so the user cannot edit it; it selects
    # their namespace by the name label the API server puts on every namespace.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["example-media"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s5n-grant-example-media-service
  labels:
    app.kubernetes.io/part-of: s5n
spec:
  policyName: s5n-granted-service
  validationActions: ["Deny"]
  paramRef:
    name: s5n-grant-example-media
    namespace: s5n-system
    parameterNotFoundAction: Deny
  matchResources:
    # The binding is cluster-scoped, so the user cannot edit it; it selects
    # their namespace by the name label the API server puts on every namespace.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["example-media"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s5n-grant-example-media-login
  labels:
    app.kubernetes.io/part-of: s5n
spec:
  policyName: s5n-no-login-changes
  validationActions: ["Deny"]
  # No paramRef: the login policy is a constant rule, and a binding that
  # pointed at the grant's ConfigMap would make it depend on one it never reads.
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["example-media"]
