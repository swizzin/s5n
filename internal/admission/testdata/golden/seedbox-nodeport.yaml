apiVersion: v1
kind: ConfigMap
metadata:
  name: s5n-grant-seedbox
  namespace: s5n-system
  labels:
    app.kubernetes.io/part-of: s5n
    s5n.io/grant: seedbox
data:
  # Generated from charts/s5n/variants.yaml; edit the chart, not this.
  blessedRepositories: "ghcr.io/home-operations/plex,ghcr.io/home-operations/prowlarr,ghcr.io/home-operations/qbittorrent,ghcr.io/home-operations/radarr,ghcr.io/home-operations/sonarr,ghcr.io/home-operations/tautulli,ghcr.io/seerr-team/seerr,ghcr.io/swizzin/s5n"
  serviceType: NodePort
  torrentNodePort: "31111"

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s5n-grant-seedbox
  labels:
    app.kubernetes.io/part-of: s5n
spec:
  policyName: s5n-blessed-images
  validationActions: ["Deny"]
  paramRef:
    name: s5n-grant-seedbox
    namespace: s5n-system
    parameterNotFoundAction: Deny
  matchResources:
    # The binding is cluster-scoped, so the user cannot edit it; it selects
    # their namespace by the name label the API server puts on every namespace.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["seedbox"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s5n-grant-seedbox-service
  labels:
    app.kubernetes.io/part-of: s5n
spec:
  policyName: s5n-granted-service
  validationActions: ["Deny"]
  paramRef:
    name: s5n-grant-seedbox
    namespace: s5n-system
    parameterNotFoundAction: Deny
  matchResources:
    # The binding is cluster-scoped, so the user cannot edit it; it selects
    # their namespace by the name label the API server puts on every namespace.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["seedbox"]
