# The test jobs: Go, lint, chart, the release rehearsal, and the two e2e suites (the
# chart's own install, and box's), for one ref. ci.yaml calls this for every PR and
# push, and again for develop after a release's back-merge. A push to develop whose
# whole change is documentation runs the first four and skips the e2e. It is its own
# file because GitHub resolves called workflows before evaluating any `if:`, so a
# workflow that called itself would recurse to the depth limit.
#
# Actions are pinned by commit; the comment names the tag the commit belongs to.
name: test

on:
  workflow_call:
    inputs:
      ref:
        description: "the ref to test; empty tests the commit that triggered the caller"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  HELM_VERSION: v4.3.0
  # Tools come from their release binaries, checked against these sha256s, so
  # the verifiers do not depend on the Go toolchain setup-go pins from go.mod.
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # kubeconform-linux-amd64.tar.gz
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d # kind-linux-amd64
  # The runner image ships a kubectl of its own choosing; the box e2e pins one
  # because it patches a Certificate's status subresource and compares the
  # Gateway's managedFields, both of which need a client near the node's version
  # (kindest/node is 1.37).
  KUBECTL_VERSION: v1.37.2
  KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4 # kubectl-linux-amd64

jobs:
  # ---- the compiler cache: one key per family, and why -----------------------
  #
  # setup-go's own cache is off everywhere (cache: false) and each compiling
  # job restores ~/.cache/go-build under a key of its own family. setup-go keys
  # a cache by the runner, the Go version and go.sum alone, so every job in a
  # run asks for the same entry -- and the first job to finish saves it. That
  # was the chart job, which compiles nothing: it stored 7.5 KB under
  # setup-go-Linux-x64-...-<go.sum hash>, and from then on every job read "Cache
  # hit occurred on the primary key ..., not saving cache." So go, lint and both
  # e2e jobs compiled client-go and the Helm SDK from zero on every push: the go
  # job's 7.3 minutes are almost all of it compiling.
  #
  # The family is in the key because the artifacts are not interchangeable:
  # `go test -race` builds every package with the race detector, a plain build
  # does not, and the linter typechecks with its own flags, so a job that saved
  # under another family's key would hand its successor hits it cannot use.
  #
  # go.sum and the installed Go version are in the key, so a dependency or
  # toolchain change rolls every family over; restore-keys then hands the new
  # key the family's previous entry, which still holds every package that did
  # not change. Only the compiler's cache is stored, not the module cache: that
  # is a re-download of a few hundred MB from GitHub's proxy, well under a
  # minute, and it would double the archive. Three entries per branch that
  # pushes -- a few hundred MB each -- against the 10 GB a repository gets.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false # the step below, under this job's own key
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-test-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...
      # The k0s checksums charts/s5n/platform.yaml pins are checked against the
      # release's own assets here: a Renovate k0s pull request bumps a version
      # it cannot write sums for, so its own branch gets them from
      # .github/workflows/k0s-sums.yaml (the sums bot, whose App-token push
      # starts this run again). It downloads both assets (a few hundred MB),
      # hence its own step. In the go job because that job runs on every push
      # and pull request; the e2e jobs start beside it now, so a bad sum no
      # longer stops their runners -- it fails the run a merge is judged on.
      - name: k0s checksums match the release's assets
        run: go run ./hack/k0s-sums --check

  lint:
    runs-on: ubuntu-latest
    steps:
      # The whole history: --new-from-merge-base needs the merge base with
      # develop, and a depth-1 checkout has none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false # the linter's typecheck hits are its own family's
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-lint-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          # The tree predates these linters, and their structural findings are
          # follow-up cards, so only what this branch adds may fail here. The
          # action's only-new-issues reads a pull request's patch and does
          # nothing on a push; --new-from-merge-base is the linter's own filter
          # and works on both.
          args: --new-from-merge-base=origin/develop

  chart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, middle, newest. Keep in step with AGENTS.md.
        kubernetes: ["1.30.0", "1.34.0", "1.37.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # helm and kubeconform compile nothing of this module, and this job is
          # the quickest to finish: its empty cache save was the one every other
          # job then hit, which is why they all built from zero.
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf kubeconform.tgz -C "$HOME/.local/bin" kubeconform && rm kubeconform.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hack/validate-chart.sh "${{ matrix.kubernetes }}"

  # The release's own steps, on every PR and push. release.yaml's s5n path ran
  # for the first time at the 0.3.0 tag and had two bugs in it, neither of which
  # anything else could have caught. This job calls hack/release.sh -- the
  # scripts the release calls -- through hack/release-rehearsal.sh, rather than
  # testing a copy of the logic: a copy passes while the release fails.
  #
  # No image build here. Both real release runs built the image, and a qemu
  # arm64 build on every PR costs more than it proves: the packaged chart's
  # render check (the chart naming the image by tag and digest) is what a
  # post-push failure would otherwise show up as.
  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # every tag: the version check's previous s5n-v* is the question
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # It builds hack/release -- semver and yaml -- and nothing else of the
          # module, so it has no build output worth an entry of its own.
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf kubeconform.tgz -C "$HOME/.local/bin" kubeconform && rm kubeconform.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hack/release-rehearsal.sh

  # ---- whether an e2e is worth a runner --------------------------------------
  #
  # A push to develop that changed nothing but documentation skips both e2e
  # jobs, because a documentation commit cannot change what they assert and on
  # develop that is the common case. Every pull request and every push to main
  # runs them, and so does the back-merge's call (it passes a ref, and it is a
  # job inside main's run).
  #
  # The diff is against develop's last green run, not github.event.before: a
  # push to develop cancels the run before it, so the commit it replaced may
  # never have finished its e2e (or failed it), and a documentation commit on
  # top must not wave that code through. A green run either ran the e2e or was
  # itself documentation on top of one that did, so everything since it is what
  # this push has to answer for.
  #
  # The decision is hack/changes, which is tested, and not a `paths:` filter:
  # a force push, a branch's first push, a rename out of docs/ and an empty diff
  # all run the e2e, and a workflow cannot test its own `if:`. This job fetches
  # the whole history because the base is an older commit a shallow checkout
  # does not have; it compiles one small command and nothing else, so it costs
  # seconds.
  #
  # When the command cannot decide -- the base is not an object here, go run
  # failed -- the step warns and answers e2e=true. A skipped e2e is an assertion
  # not held; a wasted runner is minutes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # develop's last green run, the base of the diff
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0 # github.event.before has to be an object here
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one small command: no entry of its own
      - name: is the e2e needed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
          REF_INPUT: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Only a push to develop may skip. A pull request has no base commit
          # of its own, a push to main may be cutting a release, and the
          # back-merge's test-develop call passes a ref and runs in main's run.
          if [ "$REF_INPUT" != "" ] || [ "$EVENT_NAME" != push ] || [ "$REF" != refs/heads/develop ]; then
            echo "not a push to develop: everything runs" >&2
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The base: the newest push to develop whose whole ci run passed. A
          # cancelled or failed run is not one, so its commits stay in the diff.
          if ! base=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yaml/runs?branch=develop&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty') || [ -z "$base" ]; then
            echo "::warning::no green run on develop to diff against; running the e2e"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base: ${base}, develop's last green run" >&2
          # stdout is KEY=VALUE for $GITHUB_OUTPUT; the reason on stderr is this
          # log, and a command that fails to build or run must not decide.
          if ! verdict=$(go run ./hack/changes e2e "$base" "$HEAD" 2>"${RUNNER_TEMP}/changes.err"); then
            sed 's/^/changes: /' "${RUNNER_TEMP}/changes.err" >&2
            echo "::warning::hack/changes could not decide; running the e2e"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed 's/^/changes: /' "${RUNNER_TEMP}/changes.err" >&2
          echo "$verdict" | tee -a "$GITHUB_OUTPUT"

  # Beside the jobs above, not after them: each e2e builds its own box and its
  # own cluster on its own runner, so a green compile is not a precondition for
  # a cluster to boot -- `needs: [go, chart]` only made every run hold an e2e
  # runner idle for the 7.4 minutes go takes. They wait for `changes` alone,
  # which is seconds. A failure in either job still fails the run, so no
  # assertion is let through.
  e2e-kind:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false # the step below
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kind
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hack/e2e-kind.sh

  # The other half of the acceptance test: the same install done through
  # `box bootstrap` instead of Helm, on three kind clusters -- fresh (box
  # installs the whole platform, then Pebble proves HTTP-01 through the
  # Gateway), preinstalled (an address layer box must not touch) and
  # foreign-gateway (a Gateway implementation box refuses, writing nothing).
  # It is the only test that installs cert-manager and Authelia, and the
  # platform pins' patch automerge rests on it. It never installs k0s: kind
  # stands in for the cluster, so k0s bumps are not automerged.
  #
  # Beside e2e-kind, not after it: each job gets its own runner, so they share
  # no docker image tag, cluster name or kubeconfig. (On one machine they
  # cannot run at once -- both write $HOME/.cache/s5n-e2e/kubeconfig -- which
  # is why a maintainer runs them one after another by hand.)
  #
  # One job per scenario, because a scenario owns its own kind cluster, registry
  # container and work directory (hack/e2e-box.sh): on one runner the three are
  # a queue and the job costs their sum, 24.4 minutes. fail-fast is off so one
  # scenario's failure does not hide the other two: they disagree about what is
  # on the cluster before box runs, and a maintainer wants all three verdicts
  # from one push.
  #
  # Each timeout is twice the scenario's observed time rounded up, and covers
  # the checkout, the tool installs and the cluster it builds before asserting:
  # fresh 10.3 min -> 25, preinstalled 11.1 -> 25, foreign-gateway 1.0 -> 15.
  e2e-box:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    name: e2e-box (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: fresh
            timeout: 25
          - scenario: preinstalled
            timeout: 25
          - scenario: foreign-gateway
            timeout: 15
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: false # the step below: the three scenarios build the same code
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # One entry for all four build jobs (e2e-kind and the three scenarios):
          # they compile the same packages, so whichever finishes first saves it
          # and the rest read a hit. A save that loses that race is a warning,
          # not a failure.
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kind
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $HOME/.local/bin/kind" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install kubectl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $HOME/.local/bin/kubectl" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hack/e2e-box.sh ${{ matrix.scenario }}
