# Two tag families, one workflow (docs/box.md, "Where a release lives").
#
#   s5n-v<version>  publishes the image ghcr.io/swizzin/s5n:<version> and the
#                   chart at oci://ghcr.io/swizzin/charts/s5n, version and
#                   appVersion both <version>, the image named by digest. Its
#                   GitHub release lists the app images and the platform pins
#                   that moved since the last s5n-v* tag, and is never marked
#                   latest.
#   box-v<version>  publishes box's binaries and sha256sums.txt as the assets of
#                   a GitHub release marked latest, so releases/latest always
#                   means box. Only a maintainer's tag cuts one: box's own code
#                   is released by hand, and a platform patch ships in the
#                   chart, so there is nothing for a bot to decide.
#
# A tag pushed with the default GITHUB_TOKEN starts no workflow, so the job that
# decides a push to main may release (ci.yaml) cannot reach this one by pushing
# a tag: it calls this workflow, s5n family only, with the version and the ref
# to build. Both triggers meet in `route`, the one place the family, the version
# and the ref are decided; a job for a family whose turn it is not is skipped.
#
# There is no off switch in the repo. If releases have to stop, disable this
# workflow (or ci) in GitHub's Actions tab: a disabled workflow runs nothing, so
# a maintainer's tag publishes nothing either, which is what a kill switch has
# to mean.
#
# Version rule. A maintainer's tag must equal charts/s5n/Chart.yaml's version
# and appVersion, exactly as it always has: the chart is bumped in the commit
# that is tagged. An automatic chart release takes its version from the
# tag/input and packages with `helm package --version/--app-version`, because
# the workflow never commits to main: Chart.yaml still carries the previous
# patch. The automatic version is checked to be the same major.minor as
# Chart.yaml, one patch above the previous s5n-v* tag.
#
# Actions are pinned by commit; the comment names the tag the commit belongs to.
# Tool binaries are fetched and sha256-checked the way test.yaml does it.
name: release

on:
  push:
    tags: ["s5n-v*", "box-v*"]
  workflow_call:
    inputs:
      version:
        description: "the chart version to publish, without the s5n-v prefix"
        required: true
        type: string
      ref:
        description: "the ref to build: the tag the push to main created"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883 # kubeconform-linux-amd64.tar.gz
  IMAGE: ghcr.io/swizzin/s5n
  CHART_REPO: oci://ghcr.io/swizzin/charts

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      family: ${{ steps.route.outputs.family }}
      version: ${{ steps.route.outputs.version }}
      ref: ${{ steps.route.outputs.ref }}
    steps:
      - name: which family, which version, which ref
        id: route
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          IN_VERSION: ${{ inputs.version }}
          IN_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" = workflow_call ]]; then
            # Only the chart family is ever called: the push to main that
            # decided to release always cuts s5n-v*.
            family=s5n
            version="$IN_VERSION"
            ref="$IN_REF"
          else
            # A tag push: the family is the prefix and the version is what
            # follows it. v0.2.0 is history and matches neither prefix.
            case "$REF_NAME" in
              s5n-v*) family=s5n; version="${REF_NAME#s5n-v}" ;;
              box-v*) family=box; version="${REF_NAME#box-v}" ;;
              *) echo "tag ${REF_NAME} is neither s5n-v* nor box-v*" >&2; exit 1 ;;
            esac
            ref="$REF"
          fi
          case "$family" in
            s5n|box) ;;
            *) echo "family '${family}': only s5n or box" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version '${version}': a release version is <major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "family=${family} version=${version} ref=${ref}"
          {
            echo "family=${family}"
            echo "version=${version}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"

  # ---- s5n: the image and the chart -------------------------------------------
  s5n-verify:
    needs: route
    if: needs.route.outputs.family == 's5n'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.ref }}
          fetch-depth: 0 # tags: the automatic check needs the previous s5n-v*
      - name: the version is the chart's, or one patch above the last tag
        env:
          VERSION: ${{ needs.route.outputs.version }}
          AUTOMATED: ${{ github.event_name == 'workflow_call' }}
        run: |
          set -euo pipefail
          # Only top-level keys: Chart.yaml's annotations and kubeVersion are not
          # this question, and helm is not needed to read one line.
          chart_version=$(awk '/^version:/ { print $2; exit }' charts/s5n/Chart.yaml)
          app_version=$(awk '/^appVersion:/ { print $2; exit }' charts/s5n/Chart.yaml | tr -d '"')
          if [[ "$AUTOMATED" = true ]]; then
            # The automatic release's version. The workflow never commits the
            # bump, so Chart.yaml still carries the previous patch: the version
            # has to be the chart's major.minor, one patch above the last
            # s5n-v* tag.
            want_major_minor="${chart_version%.*}"
            if [[ "${VERSION%.*}" != "$want_major_minor" ]]; then
              echo "the automatic version ${VERSION} is not ${want_major_minor}.x, charts/s5n/Chart.yaml's major.minor" >&2
              exit 1
            fi
            git fetch --tags --force --quiet
            prev=$(git tag --list 's5n-v*' | sed 's/^s5n-v//' | grep -vx "$VERSION" | sort -V | tail -1)
            if [[ -z "$prev" ]]; then
              echo "no previous s5n-v* tag for ${VERSION} to be one patch above" >&2
              exit 1
            fi
            want="${prev%.*}.$(( ${prev##*.} + 1 ))"
            if [[ "$VERSION" != "$want" ]]; then
              echo "the automatic version ${VERSION} is not one patch above ${prev} (want ${want})" >&2
              exit 1
            fi
          else
            if [[ "$chart_version" != "$VERSION" ]]; then
              echo "charts/s5n/Chart.yaml version is ${chart_version}, but the tag is s5n-v${VERSION}: bump the chart in the commit you tag" >&2
              exit 1
            fi
            if [[ "$app_version" != "$VERSION" ]]; then
              echo "charts/s5n/Chart.yaml appVersion is ${app_version}, but the tag is s5n-v${VERSION}: the image tag and the chart's appVersion are the same version" >&2
              exit 1
            fi
          fi
          echo "releasing s5n ${VERSION}"

  s5n-image:
    needs: [route, s5n-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.ref }}
      # arm64 is built on an amd64 runner: qemu runs the Dockerfile's build
      # stage, and Go cross-compiles inside it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push linux/amd64 and linux/arm64
        id: build
        env:
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --metadata-file "${RUNNER_TEMP}/image.json" \
            --push .
          # The digest of the pushed manifest list: the chart pins the image by
          # this, so every architecture resolves to the bytes this run built.
          digest=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/image.json")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "no manifest-list digest in the build metadata (got '${digest}')" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: the tag is a two-platform list
        env:
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          out=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")
          grep -q "linux/amd64" <<<"$out" || { echo "${IMAGE}:${VERSION} has no linux/amd64 image" >&2; exit 1; }
          grep -q "linux/arm64" <<<"$out" || { echo "${IMAGE}:${VERSION} has no linux/arm64 image" >&2; exit 1; }

  s5n-chart:
    needs: [route, s5n-verify, s5n-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install kubeconform
        run: |
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf kubeconform.tgz -C "$HOME/.local/bin" kubeconform && rm kubeconform.tgz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The packaged chart, not the tree, is what a release is: the digest is
      # stamped into a copy, so the committed variants.yaml keeps its "" and a
      # checkout stays reproducible.
      - name: stamp the image digest into the chart
        env:
          DIGEST: ${{ needs.s5n-image.outputs.digest }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/chart"
          rm -rf "$work"
          mkdir -p "$work/charts" "$work/hack" "$work/dist"
          cp -a charts/s5n "$work/charts/s5n"
          cp hack/validate-chart.sh "$work/hack/validate-chart.sh"

          # values.schema.json owns what a digest may look like. Reading the
          # pattern from the schema means a tightened pattern fails this step
          # instead of quietly accepting something the chart would refuse.
          pattern=$(jq -r '.definitions.digest.pattern' charts/s5n/values.schema.json)
          if [[ "$pattern" != '^(|sha256:[a-f0-9]{64})$' ]]; then
            echo "values.schema.json's digest pattern is '${pattern}'; this workflow stamps a sha256 digest" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "digest '${DIGEST}' is not a sha256 digest" >&2
            exit 1
          fi

          # Only s5n.default.digest: every other variant keeps the digest it
          # shipped with.
          python3 - "$work/charts/s5n/variants.yaml" "$DIGEST" <<'PY'
          import sys
          path, digest = sys.argv[1], sys.argv[2]
          lines = open(path).read().splitlines(keepends=True)
          out, in_s5n, in_default, stamped = [], False, False, False
          for line in lines:
              stripped = line.strip()
              if stripped and not line[:1].isspace() and not stripped.startswith("#"):
                  in_s5n = stripped == "s5n:"
                  in_default = False
              elif in_s5n and line.startswith("  ") and not line.startswith("    ") and stripped:
                  in_default = stripped == "default:"
              elif in_s5n and in_default and stripped.startswith("digest:"):
                  indent = line[: len(line) - len(line.lstrip())]
                  line = f'{indent}digest: "{digest}"\n'
                  stamped = True
              out.append(line)
          if not stamped:
              sys.exit("variants.yaml: no s5n.default.digest line to stamp")
          open(path, "w").write("".join(out))
          PY
      # The chart's own validation, against the stamped copy, then the package
      # and its push: the tree is not what ships, this copy is. An automated
      # release takes its version from the tag/input (Chart.yaml still carries
      # the previous patch, because the workflow never commits to main); a
      # maintainer's tag already matches Chart.yaml, so helm reads it there.
      - name: package, lint and push the chart
        env:
          VERSION: ${{ needs.route.outputs.version }}
          DIGEST: ${{ needs.s5n-image.outputs.digest }}
          AUTOMATED: ${{ github.event_name == 'workflow_call' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/chart"
          "$work/hack/validate-chart.sh" 1.37.0
          if [[ "$AUTOMATED" = true ]]; then
            helm package "$work/charts/s5n" --destination "$work/dist" \
              --version "$VERSION" --app-version "$VERSION"
          else
            helm package "$work/charts/s5n" --destination "$work/dist"
          fi
          tgz="$work/dist/s5n-${VERSION}.tgz"
          test -f "$tgz" || { echo "helm package did not produce $(basename "$tgz")" >&2; exit 1; }
          # The package itself lints, reads back, and renders the image this run
          # pushed, by tag and by digest: the archive is the chart that ships.
          helm lint "$tgz"
          helm show values "$tgz" >/dev/null
          rendered=$(helm template release "$tgz" -n seedbox)
          want="${IMAGE}:${VERSION}@${DIGEST}"
          if ! grep -q "$want" <<<"$rendered"; then
            echo "the packaged chart does not render ${want}" >&2
            exit 1
          fi
          echo "packaged $(basename "$tgz") naming ${want}"
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          helm push "$tgz" "${CHART_REPO}"

  s5n-release:
    # The release is the last thing that exists: a chart push that failed must
    # not leave a GitHub release pointing at a tag nothing was published for.
    needs: [route, s5n-verify, s5n-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.ref }}
          fetch-depth: 0 # tags: the previous s5n-v* is the diff's other side
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: the images and pins that moved since the last s5n-v* tag
        env:
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          tag="s5n-v${VERSION}"
          prev=$(git tag --list 's5n-v*' | grep -vx "$tag" | sort -V | tail -1)
          # Both files, through the same parser the release decision uses, so
          # "moved" means the same thing to the body as to the job that cut the
          # tag. The platform pins ship in the chart, so a pin bump is a chart
          # release and the user has to see which pin their update brings.
          if [[ -n "$prev" ]]; then
            go run ./hack/release notes "$prev" "$tag" > "${RUNNER_TEMP}/body.md"
          else
            go run ./hack/release notes --all "$tag" > "${RUNNER_TEMP}/body.md"
          fi
          cat "${RUNNER_TEMP}/body.md"
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          # Never latest: releases/latest means box, so a host's install curl
          # always fetches a box, never a chart.
          gh release create "s5n-v${VERSION}" \
            --title "s5n ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/body.md" \
            --latest=false \
            --verify-tag

  # ---- box: the binaries ------------------------------------------------------
  box-release:
    needs: route
    if: needs.route.outputs.family == 'box'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build box for linux/amd64 and linux/arm64
        env:
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/box-linux-${arch}" ./cmd/box
          done
          (cd dist && sha256sum box-linux-amd64 box-linux-arm64 > sha256sums.txt && cat sha256sums.txt)
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          set -euo pipefail
          # Latest: releases/latest/download/box-linux-<arch> is how README's
          # install curl finds box, so the newest box must be the newest release.
          gh release create "box-v${VERSION}" \
            --title "box ${VERSION}" \
            --generate-notes \
            --latest=true \
            --verify-tag \
            dist/box-linux-amd64 dist/box-linux-arm64 dist/sha256sums.txt
