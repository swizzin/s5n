# The Gateway box bootstrap installs; the kind e2e applies the same file.
#
# The GatewayClass and Gateway "s5n" live in s5n-gateway, which this file also
# creates: server-side apply cannot write a Gateway into a namespace that is not
# there. The listener is plain HTTP on 80, accepting routes from every namespace.
#
# The envoy-gateway chart ships the controller and the Gateway API CRDs (the
# experimental channel the controller is built against). The chart owns the CRDs on
# purpose: a separately pinned standard channel can drift from, or conflict with, the
# set the controller expects. It also runs the proxy data plane in
# envoy-gateway-system, which is what the chart's networkPolicy.gatewayFrom assumes.
apiVersion: v1
kind: Namespace
metadata:
  name: s5n-gateway
  labels:
    app.kubernetes.io/part-of: s5n
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
  labels:
    app.kubernetes.io/part-of: s5n
    # Box created this class beside the Envoy Gateway release it installed.
    app.kubernetes.io/managed-by: box
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: s5n
  namespace: s5n-gateway
  labels:
    app.kubernetes.io/part-of: s5n
    app.kubernetes.io/managed-by: box
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
