# Every version box installs, in one file (docs/box.md, "Updates > the platform
# layer"). box compiles these bytes in (install/platform/embed.go), hack/versions
# prints them for hack/e2e-kind.sh and hack/e2e-box.sh, and .github/renovate.json
# opens one pull request per upstream release -- so the e2e always tests exactly
# the versions box ships, and a bump is one line in one file.
#
# A value is the version exactly as the upstream artefact publishes it: k0s's
# release tag, the chart's own version, or -- for the login, which box writes
# the Deployment for -- the whole image reference, repository, tag and digest.
# Nothing downstream adds or strips a leading "v" by hand; internal/platform.AtPin
# compares the deployed chart version to the pin as semver, which accepts either
# spelling.
#
# The comment on each line is the pin's source, and it is what Renovate reads:
# datasource and the package name the version comes from. One line, one pin, one
# bump. The chart/ref names box pulls each chart from are not versions and stay
# in internal/platform/platform.go.
#
# Versions that exist only for tests (the foreign Gateway scenario, the local
# registry, Pebble) stay in the scripts, pinned by digest.
authelia: "docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54"  # renovate: datasource=docker depName=authelia/authelia
k0s: v1.37.2+k0s.1       # renovate: datasource=github-releases depName=k0sproject/k0s
envoyGateway: 1.9.3       # renovate: datasource=docker depName=envoyproxy/gateway-helm
metallb: 0.16.1           # renovate: datasource=helm depName=metallb registryUrl=https://metallb.github.io/metallb
certManager: v1.21.3      # renovate: datasource=docker depName=jetstack/charts/cert-manager registryUrl=https://quay.io
