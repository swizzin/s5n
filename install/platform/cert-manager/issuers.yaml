# cert-manager's issuers and the box root, owned by box. Cluster-scoped because a
# Certificate in any seedbox namespace may name them and no user may replace them.
#
# s5n-letsencrypt solves HTTP-01 through the Gateway box owns: the solver's temporary
# HTTPRoute attaches to every listener that admits its namespace, so it carries no
# sectionName -- pinning it to the generic listener would stop matching once a host has
# its own port-80 listener. No email: Let's Encrypt stopped sending expiry mail. The
# account key is cert-manager's own Secret, not the seedbox's.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: s5n-letsencrypt
  labels:
    app.kubernetes.io/part-of: s5n
    app.kubernetes.io/managed-by: box
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: s5n-letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: s5n
                namespace: s5n-gateway
---
# s5n-bootstrap signs exactly one object, the root below. A self-signed leaf is its own
# CA, so anything that pinned it would break on a schedule, silently, on every box at
# once; a long-lived root signed once does not. Keeping it apart from the CA issuer is
# what makes the ordering enforceable: the root is Ready before that issuer exists.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: s5n-bootstrap
  labels:
    app.kubernetes.io/part-of: s5n
    app.kubernetes.io/managed-by: box
spec:
  selfSigned: {}
---
# The box's root, in cert-manager because a ClusterIssuer's ca.secretName is read
# from its cluster-resource namespace and no seedbox or user may read it.
#
# Ten years with a year's margin: a root that outlives the box, rotated deliberately.
# ECDSA P-256 because cert-manager signs natively with it and every client supports it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s5n-root-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: s5n
    app.kubernetes.io/managed-by: box
spec:
  secretName: s5n-root-ca
  commonName: s5n box root
  isCA: true
  duration: 87600h
  renewBefore: 8760h
  # The key never rotates: an anchor copied into a seedbox was made from it, so a
  # renewal must not orphan it. cert-manager's default (Always) would cut that off.
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: s5n-bootstrap
    kind: ClusterIssuer
---
# s5n-selfsigned is for a host name that does not resolve to a public address. It is a
# CA issuer over the root above, so a host's certificate renews against the same root;
# clients still have to be told to trust it, which is the honest state of a box nobody
# can reach from the internet.
#
# The name is kept: every Certificate box has written names it, and a rename orphans
# each one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: s5n-selfsigned
  labels:
    app.kubernetes.io/part-of: s5n
    app.kubernetes.io/managed-by: box
spec:
  ca:
    secretName: s5n-root-ca
