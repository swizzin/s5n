# The grant, enforced by the cluster.
#
# A user's kubeconfig is scoped to their namespace, so box refusing a key in their
# values file is not enforcement: they can run kubectl or helm directly. These policies
# are what make the grant true.
#
# Root installs them at `box bootstrap`, never in the s5n release (which stays
# namespace-scoped with no cluster RBAC), and binds them per user namespace at
# `box adduser`, with params in the root-owned s5n-system (a ConfigMap in the user's
# own namespace would be theirs to edit). Root's seedbox is unbound: this is tenancy,
# not a cluster-wide image policy.
#
# Params (s5n-grant-<namespace> in s5n-system): blessedRepositories, generated from the
# chart's variants.yaml so "blessed" has one definition; serviceType, the type granted
# for the torrent peers Service; torrentNodePort, the port root assigned.
#
# One policy per resource shape: the API server type-checks each expression against
# every matched kind, so a Service field inside a Pod rule is a warning and a hazard
# even behind a ternary that never reaches it.
#
# failurePolicy Fail: if a policy cannot be evaluated (params missing, a CEL error) the
# write is refused rather than admitted. An admission hole on a typo is worse than a
# release that will not install.
apiVersion: v1
kind: Namespace
metadata:
  name: s5n-system
  labels:
    app.kubernetes.io/part-of: s5n
    # Root owns this namespace; nothing a seedbox user can do reaches it.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-blessed-images
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      # Pods and every workload kind with a pod template, CronJobs included so a bad
      # template is refused when written.
      #
      # `pods/ephemeralcontainers` is `kubectl debug`'s subresource, which a rule for
      # "pods" does not match: without it any image could be added to a pod.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podspec
      expression: >
        has(object.spec.containers) ? object.spec :
        (has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec)
    - name: images
      expression: >
        variables.podspec.containers.map(c, c.image) +
        (has(variables.podspec.initContainers) ? variables.podspec.initContainers.map(c, c.image) : []) +
        (has(variables.podspec.ephemeralContainers) ? variables.podspec.ephemeralContainers.map(c, c.image) : [])
    - name: blessed
      expression: "params.data.blessedRepositories.split(',').filter(r, r != '')"
    # An image matches only as `repo:tag` or `repo@digest`, so `.../sonarr-evil` cannot
    # pass as `.../sonarr`.
    - name: unblessed
      expression: >
        variables.images.filter(i, !variables.blessed.exists(r,
        i.startsWith(r + ':') || i.startsWith(r + '@')))
  validations:
    - expression: "variables.unblessed.size() == 0"
      messageExpression: >
        's5n: image repository is not blessed by the chart: ' + variables.unblessed.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-granted-service
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      # Services: only the granted peer port and Service type.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  variables:
    - name: serviceType
      expression: "has(object.spec.type) ? object.spec.type : 'ClusterIP'"
  validations:
    # ExternalName is neither ClusterIP nor a type the grant assigns.
    - expression: >
        variables.serviceType == 'ClusterIP' ||
        variables.serviceType == params.data.serviceType
      message: "s5n: a Service may only use ClusterIP or the type the grant assigns"
    # CVE-2020-8554: externalIPs would let a tenant claim an address and intercept its
    # traffic, and the grant has no use for them.
    - expression: >-
        !has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0
      message: "s5n: a Service may not set externalIPs"
    - expression: >
        !has(object.spec.ports) || object.spec.ports.all(p,
        !has(p.nodePort) || p.nodePort == int(params.data.torrentNodePort))
      message: "s5n: a nodePort may only be the peer port the grant assigns"
---
# The login is root's, so a user's namespace may not touch it.
#
# Root puts one Authelia and one SecurityPolicy on the Gateway covering every listener
# and route, and the exemptions are root's own configuration. Otherwise a
# namespace-admin could delete that policy or write a route-targeted one -- Envoy
# Gateway lets a route policy override the Gateway's, so "no policy" is a working
# bypass. Gateways are here for the same reason: one of the user's own would be a
# listener the login was never attached to.
#
# No params: the write is refused outright, whoever asks, in a bound namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-no-login-changes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.envoyproxy.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["securitypolicies"]
      - apiGroups: ["gateway.networking.k8s.io"]
        # Both served versions: matching one would leave the other writable.
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["gateways"]
  validations:
    - expression: "false"
      message: "s5n: the login in front of the Gateway is root's; a seedbox namespace may not add, change or remove it"
---
# A user's route may not reach the sign-in path.
#
# Authelia lets `^/auth([/?].*)?$` through without a login
# (internal/authelia/config.go, Rules). Gateway API serves the most specific route, so
# a user's `/auth/x` on their own host would beat root's portal route and never ask for
# a login. The chart's routes are app urlBases, never under /auth; this closes the hole
# for a hand-written route.
#
# A RegularExpression match can reach /auth without spelling it, and so can a
# percent-encoded path (`/%61uth/x`), so both are refused outright. `/authx` and
# `/authority` stay admitted: prefixes match whole segments.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-no-auth-routes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      # Both versions the bundle serves: matching one would leave the other writable.
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  validations:
    # Every rule and match has to pass; a rule with no matches is a catch-all. has()
    # guards the optional fields, and path.type defaults to PathPrefix.
    - expression: >-
        object.spec.rules.all(r, !has(r.matches) || r.matches.all(m,
        !has(m.path) || !has(m.path.type) || m.path.type != 'RegularExpression'))
      message: "s5n: a seedbox route may not use a RegularExpression path: a regex can reach /auth, root's sign-in path"
    - expression: >-
        object.spec.rules.all(r, !has(r.matches) || r.matches.all(m,
        !has(m.path) || !has(m.path.value) ||
        !((!has(m.path.type) || m.path.type == 'PathPrefix' || m.path.type == 'Exact') &&
        (m.path.value == '/auth' || m.path.value.startsWith('/auth/')))))
      message: "s5n: /auth is root's sign-in path; a seedbox route may not match it"
    - expression: >-
        object.spec.rules.all(r, !has(r.matches) || r.matches.all(m,
        !has(m.path) || !has(m.path.value) || !m.path.value.contains('%')))
      message: "s5n: a seedbox route may not use a percent-encoded path: it can reach /auth, root's sign-in path"
