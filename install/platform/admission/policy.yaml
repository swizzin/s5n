# The grant, enforced by the cluster.
#
# A user's seedbox namespace comes with a kubeconfig scoped to that namespace,
# so box refusing a key in the user's values file is not enforcement: the user
# can run kubectl or helm directly. These policies are what make the grant true.
#
# They live on the platform layer, installed by root at `box bootstrap`, never in
# the s5n release: the release stays namespace-scoped with no cluster RBAC.
# Root binds them to one namespace per user at `box adduser` (see
# hack/render-grant), and the bindings' params live in the root-owned s5n-system
# namespace. A ConfigMap in the user's own namespace would be writable by them
# and enforce nothing. Root's own seedbox namespace gets no binding: this is
# tenancy, not a cluster-wide image policy.
#
# Params (ConfigMap s5n-grant-<namespace> in s5n-system) carry the user's grant:
#   blessedRepositories  comma-separated repositories, generated from the
#                        chart's variants.yaml so "blessed" has one definition
#   serviceType          the type granted for the torrent peers Service
#   torrentNodePort      the nodePort root assigned to this user
#
# One policy per resource shape rather than one policy with a kind switch: the
# API server type-checks each expression against every matched kind, and a
# Service field read inside a Pod rule is a warning (and a hazard) even when a
# ternary would never reach it. Two policies, one params object, two bindings
# written together at adduser.
#
# failurePolicy Fail: if the API server cannot evaluate a policy (params
# missing, CEL error), the write is refused rather than admitted. An admission
# hole on a typo is worse than a release that will not install.
apiVersion: v1
kind: Namespace
metadata:
  name: s5n-system
  labels:
    app.kubernetes.io/part-of: s5n
    # Root owns this namespace; nothing a seedbox user can do reaches it.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-blessed-images
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      # Pods and the pod template of every workload kind that can carry one.
      # CronJobs are included so a bad template is refused when it is written,
      # not when the Job it eventually creates is.
      #
      # `pods/ephemeralcontainers` is the subresource `kubectl debug` writes
      # to. A rule for "pods" does not match a subresource request, so without
      # it the user could add any image as an ephemeral container to a pod
      # they can already patch.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podspec
      expression: >
        has(object.spec.containers) ? object.spec :
        (has(object.spec.jobTemplate) ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec)
    - name: images
      expression: >
        variables.podspec.containers.map(c, c.image) +
        (has(variables.podspec.initContainers) ? variables.podspec.initContainers.map(c, c.image) : []) +
        (has(variables.podspec.ephemeralContainers) ? variables.podspec.ephemeralContainers.map(c, c.image) : [])
    - name: blessed
      expression: "params.data.blessedRepositories.split(',').filter(r, r != '')"
    # An image matches a blessed repository only as `repo:tag` or `repo@digest`,
    # so `ghcr.io/home-operations/sonarr-evil` cannot pass as `.../sonarr`.
    - name: unblessed
      expression: >
        variables.images.filter(i, !variables.blessed.exists(r,
        i.startsWith(r + ':') || i.startsWith(r + '@')))
  validations:
    - expression: "variables.unblessed.size() == 0"
      messageExpression: >
        's5n: image repository is not blessed by the chart: ' + variables.unblessed.join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-granted-service
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      # Services: only the granted peer port and Service type.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  variables:
    - name: serviceType
      expression: "has(object.spec.type) ? object.spec.type : 'ClusterIP'"
  validations:
    # ExternalName is never admitted: it is neither ClusterIP nor a type
    # the grant renderer can assign, so the type rule below refuses it already.
    - expression: >
        variables.serviceType == 'ClusterIP' ||
        variables.serviceType == params.data.serviceType
      message: "s5n: a Service may only use ClusterIP or the type the grant assigns"
    # CVE-2020-8554: a ClusterIP Service with spec.externalIPs lets its tenant
    # claim an arbitrary address and intercept traffic to it. The grant has no
    # legitimate use for externalIPs, on any Service type.
    - expression: >-
        !has(object.spec.externalIPs) || object.spec.externalIPs.size() == 0
      message: "s5n: a Service may not set externalIPs"
    - expression: >
        !has(object.spec.ports) || object.spec.ports.all(p,
        !has(p.nodePort) || p.nodePort == int(params.data.torrentNodePort))
      message: "s5n: a nodePort may only be the peer port the grant assigns"
---
# The login is root's, so a user's namespace may not touch it.
#
# Root puts one Authelia and one SecurityPolicy on the Gateway, covering every
# listener and every route attached to it, and the exemptions (the ACME
# challenge, the portal, the Arrs' own API keys) are root's Authelia
# configuration. A namespace-scoped kubeconfig with namespace-admin rights
# could otherwise delete that policy, or write a SecurityPolicy of its own on
# a route -- Envoy Gateway lets a route-targeted policy override the
# Gateway-level one, so "no policy" is a working bypass. Gateways are here for
# the same reason: a Gateway of the user's own would be a listener the login
# was never attached to.
#
# No params: the rule refuses these writes outright, whoever asks, in a bound
# namespace. Root's own seedbox is unbound like every other policy here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s5n-no-login-changes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.envoyproxy.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["securitypolicies"]
      - apiGroups: ["gateway.networking.k8s.io"]
        # Both served versions: v1 is the Gateway, v1beta1 the ReferenceGrant
        # generation's sibling. A policy that matched one version only would
        # leave the other writable.
        apiVersions: ["v1", "v1beta1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["gateways"]
  validations:
    - expression: "false"
      message: "s5n: the login in front of the Gateway is root's; a seedbox namespace may not add, change or remove it"
