# The e2e's own values. The image tag is the locally built one (loaded into
# kind under the chart's s5n repository); the 4K Radarr instance is enabled with
# a category an existing seedbox may already use: upper case and one qBittorrent
# subcategory level. qBittorrent runs the chart's lt1.2 variant, so this run
# proves the project's own build and not only the default. Everything else is
# the chart's defaults.
#
# A values file, not --set: --set on one index of a list replaces the whole
# list, so instances[1] would arrive without its suffix and instances[0] null.
auth:
  edge: true

# The account root's login admits, which box writes from the grant: Jellyfin's
# first user is named after it, and this script installs with Helm, so the name
# is here (hack/e2e-kind.sh's APP_LOGIN must be the same one).
login: e2e

wiring:
  image:
    tag: e2e

apps:
  # The second media server. It is opt-in, and this is the one run that turns
  # everything on.
  jellyfin:
    enabled: true
    # The pod network Jellyfin must trust for the Gateway's forwarded address.
    # box writes this from the cluster's Nodes at init; a Helm install names it.
    # kind's default pod subnet is 10.244.0.0/16.
    knownProxies:
      - 10.244.0.0/16
  qbittorrent:
    image:
      # The project's own static build, so this run proves it, not only default.
      variant: lt1.2
    torrent:
      # The band box picks from, spelled out because this e2e installs with
      # helm and so chooses its own values. A port from the upper part of the
      # range can be handed to another Service before this one asks for it.
      port: 30080
  radarr:
    instances:
      - { suffix: "", category: movies, enabled: true }
      - { suffix: 4k, category: "4K/Movies", enabled: true }
